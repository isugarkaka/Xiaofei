<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>青岛啤酒 · 超级操作员控制台</title>
  <style>
/* ===== lib/lark-tokens.css ===== */
/* ============================================================
   Lark PPT — Foundations: Colors & Type
   Source: 飞书母版2025-打单 (LarkPPTTemplate.thmx)
   Theme:  飞书PPT 主题色  ·  Font scheme: 飞书品牌字
   ============================================================ */

/* ---- Webfonts -------------------------------------------------
   Original: 方正兰亭黑Pro_GB18030 (FangZheng LanTing Hei Pro)
   This is a licensed commercial CJK family. We substitute Noto
   Sans SC, the closest open-source geometric grotesque CJK
   sans available on Google Fonts. FLAG to user: replace with
   licensed FZLanTingHeiPro-* files for production parity.
---------------------------------------------------------------- */
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;900&family=Inter:wght@300;400;500;600;700;800&display=swap');

:root {

  /* ============================================================
     COLOR PRIMITIVES — drawn directly from theme1.xml clrScheme
     ============================================================ */

  /* Background / surface — slides ship dark by default
     (master clrMap swaps bg1="dk1", so dk1 is the page color) */
  --lark-bg-black:    #000000;   /* dk1  · primary slide bg */
  --lark-bg-deep:     #04060F;   /* near-black, used for hero gradients */
  --lark-bg-navy:     #0A1230;   /* deep navy, hero gradient origin */
  --lark-bg-twilight: #1B1F3A;   /* secondary panel */

  /* Foreground (on dark) */
  --lark-fg-white:    #FFFFFF;   /* lt1 · primary text on dark */
  --lark-fg-muted:    #E7E6E6;   /* lt2 · low-emphasis text on dark */
  --lark-fg-soft:     rgba(255,255,255,0.72);
  --lark-fg-quiet:    rgba(255,255,255,0.48);
  --lark-fg-faint:    rgba(255,255,255,0.16);

  /* Foreground (on light, for product UI surfaces) */
  --lark-ink:         #1F2329;   /* primary text on light surfaces */
  --lark-ink-2:       #51565D;
  --lark-ink-3:       #8F959E;
  --lark-ink-4:       #BBBFC4;
  --lark-line:        #DEE0E3;   /* divider on light */
  --lark-surface:     #FFFFFF;
  --lark-surface-2:   #F5F6F7;   /* page bg in product */
  --lark-surface-3:   #EFF0F1;

  /* Neutral — dk2/lt2 in theme */
  --lark-neutral-700: #767171;   /* dk2 */
  --lark-neutral-200: #E7E6E6;   /* lt2 */

  /* ---------- Brand accent palette (the 6 swatches) ---------- */
  --lark-blue:    #3C7FFF;       /* accent1 · primary brand blue */
  --lark-cyan:    #24C3FF;       /* accent2 */
  --lark-purple:  #5C3FFB;       /* accent3 · deep purple */
  --lark-teal:    #33D6C0;       /* accent4 · Lark logo teal */
  --lark-violet:  #9F6FF1;       /* accent5 */
  --lark-orange:  #FE7F00;       /* accent6 */

  /* Tints / shades for the brand blue (most-used accent) */
  --lark-blue-50:  #EAF1FF;
  --lark-blue-100: #C9DCFF;
  --lark-blue-200: #9DBEFF;
  --lark-blue-300: #6A9DFF;
  --lark-blue-400: #3C7FFF;      /* base · accent1 */
  --lark-blue-500: #2566EC;
  --lark-blue-600: #0057F9;      /* folHlink */
  --lark-blue-700: #003FB8;

  /* Semantic */
  --lark-link:           #3C7FFF;  /* hlink */
  --lark-link-visited:   #0057F9;  /* folHlink */
  --lark-success:        #33D6C0;
  --lark-warning:        #FE7F00;
  --lark-danger:         #F54A45;  /* commonly used in Lark product UI */
  --lark-info:           #24C3FF;

  /* ---------- Brand-defining gradients ---------- */
  /* Hero/cover gradient: navy fades to black with a faint blue
     glow top-left (matches image1.jpg / image4.jpg / image5.jpg) */
  --lark-grad-hero:
    radial-gradient(120% 100% at 0% 0%, #0F1A4A 0%, #060B22 38%, #000 78%);

  /* Section gradient: deeper, used for chapter pages */
  --lark-grad-section:
    radial-gradient(140% 110% at 100% 0%, #1A2256 0%, #050817 50%, #000 100%);

  /* Brand gradient (logo-derived: teal → cobalt → deep navy) */
  --lark-grad-brand:
    linear-gradient(135deg, #33D6C0 0%, #3C7FFF 50%, #1A1F6B 100%);

  /* Accent strip gradient (used for thin keylines / dividers) */
  --lark-grad-keyline:
    linear-gradient(90deg, #33D6C0 0%, #3C7FFF 50%, #5C3FFB 100%);

  /* ============================================================
     TYPE — drawn from theme1.xml fontScheme + slideMaster txStyles
     ============================================================ */

  /* Display / sans CJK — primary brand face */
  --lark-font-sans:
    "Noto Sans SC", "FZLanTingHeiPro_GB18030",
    "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB",
    "Helvetica Neue", Arial, sans-serif;

  /* Latin counterpart (numerals, English copy) */
  --lark-font-latin:
    "Inter", "Helvetica Neue", Arial,
    "Noto Sans SC", sans-serif;

  /* Mono (supporting — not in original theme, sensible default) */
  --lark-font-mono:
    "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;

  /* ---- Weights ---- */
  --lark-w-light:    300;
  --lark-w-regular:  400;
  --lark-w-medium:   500;   /* FZLanTingHei Medium — body copy default */
  --lark-w-semibold: 600;   /* FZLanTingHei SemiBold — H1/H2/title */
  --lark-w-bold:     700;   /* FZLanTingHei Bold — cover & big numbers */
  --lark-w-black:    900;

  /* ---- Type scale (slide-friendly @ 1920×1080)
     Names match the slide-master txStyles roles. Sizes scale
     linearly to product UI when used inside a `.product` scope. ---- */
  --lark-text-cover:    96px;   /* 50pt @ 1280 → ≈96px @ 1920 */
  --lark-text-section:  84px;   /* 一级章节页 — chapter headers */
  --lark-text-h1:       56px;   /* 30pt centered title */
  --lark-text-h2:       40px;   /* 26pt content-page title */
  --lark-text-h3:       32px;
  --lark-text-quote:    52px;   /* 金句页 (key-quote slide) */
  --lark-text-subtitle: 28px;   /* eyebrow / secondary line */
  --lark-text-body:     24px;   /* slide body — never below 24 */
  --lark-text-caption:  18px;
  --lark-text-eyebrow:  16px;   /* uppercase metadata */

  /* Line-height */
  --lark-lh-tight:   1.10;
  --lark-lh-snug:    1.25;
  --lark-lh-normal:  1.40;
  --lark-lh-loose:   1.65;

  /* Letter-spacing (CJK is ~0; latin caps slightly tracked) */
  --lark-tracking-tight:  -0.01em;
  --lark-tracking-normal: 0;
  --lark-tracking-wide:    0.04em;
  --lark-tracking-eyebrow: 0.14em;

  /* ============================================================
     SPACING / RADII / SHADOWS / MOTION
     ============================================================ */

  --lark-space-1: 4px;
  --lark-space-2: 8px;
  --lark-space-3: 12px;
  --lark-space-4: 16px;
  --lark-space-5: 24px;
  --lark-space-6: 32px;
  --lark-space-7: 48px;
  --lark-space-8: 64px;
  --lark-space-9: 96px;
  --lark-space-10: 128px;

  --lark-radius-xs: 4px;
  --lark-radius-sm: 6px;       /* Lark product buttons */
  --lark-radius-md: 8px;       /* cards, inputs */
  --lark-radius-lg: 12px;
  --lark-radius-xl: 16px;
  --lark-radius-2xl: 24px;
  --lark-radius-pill: 999px;

  /* Shadows — Lark product cards use soft, low elevations */
  --lark-shadow-1: 0 1px 2px rgba(31, 35, 41, 0.06), 0 0 1px rgba(31, 35, 41, 0.10);
  --lark-shadow-2: 0 4px 12px rgba(31, 35, 41, 0.08), 0 0 1px rgba(31, 35, 41, 0.10);
  --lark-shadow-3: 0 8px 32px rgba(31, 35, 41, 0.12);
  --lark-shadow-glow-blue: 0 0 32px rgba(60, 127, 255, 0.32);
  --lark-shadow-glow-teal: 0 0 32px rgba(51, 214, 192, 0.28);

  /* Borders */
  --lark-border-thin:   1px solid rgba(255,255,255,0.10);
  --lark-border-strong: 1px solid rgba(255,255,255,0.20);
  --lark-border-light:  1px solid var(--lark-line);

  /* Motion */
  --lark-ease:          cubic-bezier(0.4, 0, 0.2, 1);
  --lark-ease-out:      cubic-bezier(0.0, 0, 0.2, 1);
  --lark-ease-spring:   cubic-bezier(0.34, 1.56, 0.64, 1);
  --lark-dur-fast:      120ms;
  --lark-dur-base:      200ms;
  --lark-dur-slow:      400ms;
}

/* ============================================================
   SEMANTIC ROLES — apply directly to elements
   ============================================================ */

.lark-deck-bg {
  background: var(--lark-grad-hero);
  color: var(--lark-fg-white);
  font-family: var(--lark-font-sans);
}

/* Cover slide title */
.lark-cover-title {
  font-family: var(--lark-font-sans);
  font-weight: var(--lark-w-bold);
  font-size: var(--lark-text-cover);
  line-height: var(--lark-lh-tight);
  letter-spacing: var(--lark-tracking-tight);
  color: var(--lark-fg-white);
}

/* Section / chapter header */
.lark-section-title {
  font-family: var(--lark-font-sans);
  font-weight: var(--lark-w-bold);
  font-size: var(--lark-text-section);
  line-height: var(--lark-lh-tight);
  color: var(--lark-fg-white);
}

/* Content-page title (slide H2) */
.lark-h1 {
  font-family: var(--lark-font-sans);
  font-weight: var(--lark-w-semibold);
  font-size: var(--lark-text-h1);
  line-height: var(--lark-lh-snug);
  color: var(--lark-fg-white);
}
.lark-h2 {
  font-family: var(--lark-font-sans);
  font-weight: var(--lark-w-semibold);
  font-size: var(--lark-text-h2);
  line-height: var(--lark-lh-snug);
  color: var(--lark-fg-white);
}
.lark-h3 {
  font-family: var(--lark-font-sans);
  font-weight: var(--lark-w-semibold);
  font-size: var(--lark-text-h3);
  line-height: var(--lark-lh-snug);
  color: var(--lark-fg-white);
}

.lark-quote {
  font-family: var(--lark-font-sans);
  font-weight: var(--lark-w-semibold);
  font-size: var(--lark-text-quote);
  line-height: var(--lark-lh-snug);
  color: var(--lark-fg-white);
}

.lark-subtitle {
  font-family: var(--lark-font-sans);
  font-weight: var(--lark-w-medium);
  font-size: var(--lark-text-subtitle);
  line-height: var(--lark-lh-normal);
  color: var(--lark-fg-soft);
}

.lark-body {
  font-family: var(--lark-font-sans);
  font-weight: var(--lark-w-medium);
  font-size: var(--lark-text-body);
  line-height: var(--lark-lh-normal);
  color: var(--lark-fg-soft);
}

.lark-caption {
  font-family: var(--lark-font-sans);
  font-weight: var(--lark-w-regular);
  font-size: var(--lark-text-caption);
  line-height: var(--lark-lh-normal);
  color: var(--lark-fg-quiet);
}

.lark-eyebrow {
  font-family: var(--lark-font-latin);
  font-weight: var(--lark-w-semibold);
  font-size: var(--lark-text-eyebrow);
  letter-spacing: var(--lark-tracking-eyebrow);
  text-transform: uppercase;
  color: var(--lark-blue);
}

/* ============================================================
   PRODUCT-UI scope — Lark Suite app (light surface)
   Use by adding class `lark-product` on a container.
   ============================================================ */
.lark-product {
  background: var(--lark-surface-2);
  color: var(--lark-ink);
  font-family: var(--lark-font-sans);
  font-size: 14px;
  line-height: var(--lark-lh-normal);
}
.lark-product h1 { font-size: 28px; font-weight: var(--lark-w-semibold); color: var(--lark-ink); }
.lark-product h2 { font-size: 20px; font-weight: var(--lark-w-semibold); color: var(--lark-ink); }
.lark-product h3 { font-size: 16px; font-weight: var(--lark-w-semibold); color: var(--lark-ink); }
.lark-product p  { font-size: 14px; color: var(--lark-ink); }
.lark-product a  { color: var(--lark-link); text-decoration: none; }
.lark-product a:hover { text-decoration: underline; }

/* ===== styles.css ===== */
/* ============================================================
   Super Operator Console — Tsingtao × Lark
   Built on Lark PPT tokens with desktop console scoping
   ============================================================ */

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--lark-bg-black);
  color: var(--lark-fg-white);
  font-family: var(--lark-font-sans);
  min-height: 100vh;
  overflow-x: hidden;
}

body {
  background:
    radial-gradient(120% 80% at 18% -10%, rgba(60,127,255,0.18) 0%, rgba(6,11,34,0) 55%),
    radial-gradient(90% 70% at 100% 110%, rgba(51,214,192,0.10) 0%, rgba(0,0,0,0) 60%),
    linear-gradient(180deg, #060B22 0%, #03050E 50%, #000 100%);
  min-height: 100vh;
}

#root {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ---------- App Shell ---------- */

.app-shell {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  width: 100%;
  min-width: 1440px;
}

/* ---------- Top Bar ---------- */

.topbar {
  display: flex;
  align-items: center;
  height: 64px;
  padding: 0 28px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
  background: rgba(4, 6, 15, 0.6);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  position: sticky;
  top: 0;
  z-index: 100;
  gap: 24px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

.brand-logo {
  width: 36px;
  height: 36px;
  object-fit: contain;
}

.brand-text {
  display: flex;
  flex-direction: column;
  line-height: 1.1;
}

.brand-name-zh {
  font-size: 16px;
  font-weight: var(--lark-w-semibold);
  color: var(--lark-fg-white);
  letter-spacing: 0.02em;
}

.brand-name-en {
  font-size: 10px;
  font-weight: var(--lark-w-regular);
  color: var(--lark-fg-quiet);
  letter-spacing: 0.16em;
  text-transform: uppercase;
  margin-top: 2px;
}

.product-title {
  display: flex;
  align-items: center;
  gap: 10px;
  padding-left: 24px;
  border-left: 1px solid rgba(255,255,255,0.10);
}

.product-title-zh {
  font-size: 18px;
  font-weight: var(--lark-w-semibold);
  color: var(--lark-fg-white);
  letter-spacing: 0.01em;
}

.product-title-tag {
  font-size: 10px;
  letter-spacing: 0.18em;
  color: var(--lark-cyan);
  text-transform: uppercase;
  padding: 3px 8px;
  border: 1px solid rgba(36,195,255,0.40);
  border-radius: 4px;
  background: rgba(36,195,255,0.06);
}

.topbar-spacer { flex: 1; }

.topbar-meta {
  display: flex;
  align-items: center;
  gap: 20px;
  font-size: 13px;
  color: var(--lark-fg-soft);
}

.live-pulse {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 12px;
  border-radius: 999px;
  background: rgba(51,214,192,0.10);
  border: 1px solid rgba(51,214,192,0.30);
  color: var(--lark-teal);
  font-size: 12px;
  font-weight: var(--lark-w-medium);
  letter-spacing: 0.05em;
}

.live-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--lark-teal);
  box-shadow: 0 0 0 0 rgba(51,214,192,0.7);
  animation: pulse 1.6s ease-out infinite;
}

@keyframes pulse {
  0% { box-shadow: 0 0 0 0 rgba(51,214,192,0.6); }
  70% { box-shadow: 0 0 0 8px rgba(51,214,192,0); }
  100% { box-shadow: 0 0 0 0 rgba(51,214,192,0); }
}

.topbar-clock {
  font-family: var(--lark-font-latin);
  font-variant-numeric: tabular-nums;
  font-size: 13px;
  color: var(--lark-fg-soft);
}

.topbar-user {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 12px 6px 6px;
  border-radius: 999px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  font-size: 13px;
}

.topbar-avatar {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: linear-gradient(135deg, #3C7FFF 0%, #5C3FFB 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: var(--lark-w-semibold);
}

/* ---------- Sub-bar / Operator nav ---------- */

.subbar {
  display: flex;
  align-items: center;
  gap: 4px;
  height: 48px;
  padding: 0 28px;
  border-bottom: 1px solid rgba(255,255,255,0.06);
  background: rgba(0,0,0,0.30);
}

.subbar-tab {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 8px 14px;
  font-size: 14px;
  color: var(--lark-fg-quiet);
  font-weight: var(--lark-w-medium);
  border-radius: 6px;
  cursor: pointer;
  transition: color .2s, background .2s;
}

.subbar-tab.active {
  color: var(--lark-fg-white);
  background: rgba(60,127,255,0.12);
}

.subbar-tab .tab-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 18px;
  height: 18px;
  padding: 0 5px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: var(--lark-w-semibold);
  background: var(--lark-blue);
  color: #fff;
}

.subbar-tab .tab-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--lark-orange);
}

.subbar-divider {
  width: 1px;
  height: 20px;
  background: rgba(255,255,255,0.08);
  margin: 0 10px;
}

.subbar-store {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: var(--lark-fg-soft);
  margin-left: auto;
}

.subbar-store-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.10);
  border-radius: 6px;
  cursor: pointer;
}

/* ---------- Main 2-col layout (operator focus) ---------- */

.main {
  display: grid;
  grid-template-columns: 1fr 500px;
  gap: 0;
  flex: 1;
  min-height: 0;
}

.col {
  display: flex;
  flex-direction: column;
  min-width: 0;
  overflow: hidden;
}

.col-response { border-left: 1px solid rgba(255,255,255,0.06); background: rgba(0,0,0,0.20); }

.col-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 22px 12px;
}

.col-header-l {
  display: flex;
  align-items: center;
  gap: 10px;
}

.col-eyebrow {
  font-family: var(--lark-font-latin);
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--lark-fg-quiet);
  font-weight: var(--lark-w-semibold);
}

.col-title {
  font-size: 22px;
  font-weight: var(--lark-w-semibold);
  color: var(--lark-fg-white);
  letter-spacing: 0.01em;
}

.col-title-en {
  font-size: 11px;
  letter-spacing: 0.16em;
  color: var(--lark-fg-quiet);
  text-transform: uppercase;
  margin-top: 4px;
}

.role-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 10px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: var(--lark-w-semibold);
  letter-spacing: 0.10em;
  text-transform: uppercase;
}

.role-pill.intel {
  color: var(--lark-cyan);
  background: rgba(36,195,255,0.10);
  border: 1px solid rgba(36,195,255,0.30);
}
.role-pill.operator {
  color: var(--lark-orange);
  background: rgba(254,127,0,0.10);
  border: 1px solid rgba(254,127,0,0.30);
}

.role-pill .pill-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: currentColor;
}

/* ---------- Signals stream ---------- */

.signals-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 8px 18px 32px;
  overflow-y: auto;
}

.signal-card {
  position: relative;
  padding: 14px 14px 14px 18px;
  background: linear-gradient(180deg, rgba(20,28,55,0.85) 0%, rgba(12,18,40,0.75) 100%);
  border: 1px solid rgba(255,255,255,0.10);
  border-radius: 10px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  transition: all .2s var(--lark-ease);
  animation: slideIn .4s var(--lark-ease-out) backwards;
}

.signal-card.new { border-color: rgba(36,195,255,0.4); box-shadow: 0 0 0 1px rgba(36,195,255,0.10), 0 0 18px rgba(36,195,255,0.10); }

.signal-card::before {
  content: "";
  position: absolute;
  left: 0; top: 14px; bottom: 14px;
  width: 3px;
  border-radius: 0 2px 2px 0;
  background: var(--lark-cyan);
  opacity: 0.6;
}

.signal-card.signal-high::before { background: var(--lark-orange); opacity: 1; }
.signal-card.signal-mid::before { background: var(--lark-blue); opacity: 0.8; }

@keyframes slideIn {
  from { opacity: 0; transform: translateY(-6px); }
  to { opacity: 1; transform: translateY(0); }
}

.signal-head {
  display: flex;
  align-items: center;
  gap: 8px;
  justify-content: space-between;
}

.signal-source {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  letter-spacing: 0.06em;
  color: var(--lark-fg-quiet);
  font-weight: var(--lark-w-medium);
}

.signal-source-icon {
  width: 16px; height: 16px;
  display: inline-flex; align-items: center; justify-content: center;
  border-radius: 4px;
  background: rgba(255,255,255,0.06);
  color: var(--lark-fg-soft);
}

.signal-time {
  font-size: 10px;
  color: var(--lark-fg-quiet);
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.04em;
}

.signal-body {
  font-size: 14px;
  line-height: 1.45;
  color: var(--lark-fg-white);
  font-weight: var(--lark-w-medium);
}

.signal-body .signal-hl {
  color: var(--lark-cyan);
  font-weight: var(--lark-w-semibold);
}
.signal-body .signal-hl-warn {
  color: var(--lark-orange);
  font-weight: var(--lark-w-semibold);
}

.signal-meta {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  font-size: 11px;
  color: var(--lark-fg-quiet);
}

.signal-meta-item {
  display: inline-flex; align-items: center; gap: 4px;
}

/* ---------- Center column (legacy) ---------- */

/* AI synthesis card */
.synthesis-card {
  position: relative;
  padding: 28px 32px;
  background:
    linear-gradient(135deg, rgba(60,127,255,0.10) 0%, rgba(92,63,251,0.04) 50%, rgba(0,0,0,0) 100%),
    rgba(255,255,255,0.025);
  border: 1px solid rgba(60,127,255,0.30);
  border-radius: 16px;
  box-shadow: 0 0 40px rgba(60,127,255,0.10);
}

.synth-head {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 14px;
}

.synth-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 12px;
  font-size: 11px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  font-weight: var(--lark-w-semibold);
  color: var(--lark-fg-white);
  background: linear-gradient(90deg, rgba(60,127,255,0.6), rgba(92,63,251,0.4));
  border-radius: 999px;
}

.synth-time {
  font-size: 12px;
  color: var(--lark-fg-quiet);
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.05em;
}

.synth-conf {
  margin-left: auto;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: var(--lark-fg-soft);
}
.synth-conf-val {
  color: var(--lark-teal);
  font-weight: var(--lark-w-semibold);
  font-size: 14px;
  font-variant-numeric: tabular-nums;
}

.synth-title {
  font-size: 32px;
  line-height: 1.25;
  font-weight: var(--lark-w-semibold);
  color: var(--lark-fg-white);
  letter-spacing: -0.005em;
  margin: 0;
  text-wrap: pretty;
}

.synth-title .hl-warm { color: var(--lark-orange); }
.synth-title .hl-cool { color: var(--lark-cyan); }

.synth-sub {
  margin-top: 14px;
  font-size: 15px;
  line-height: 1.55;
  color: var(--lark-fg-soft);
}

.synth-metrics {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 0;
  margin-top: 24px;
  padding-top: 22px;
  border-top: 1px solid rgba(255,255,255,0.10);
}

.synth-metric {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding-right: 16px;
  border-right: 1px solid rgba(255,255,255,0.06);
}
.synth-metric:last-child { border-right: 0; }

.metric-label {
  font-size: 12px;
  color: var(--lark-fg-quiet);
  letter-spacing: 0.04em;
}

.metric-val {
  display: flex;
  align-items: baseline;
  gap: 4px;
  font-variant-numeric: tabular-nums;
  color: var(--lark-fg-white);
}

.metric-num {
  font-size: 30px;
  font-weight: var(--lark-w-bold);
  letter-spacing: -0.01em;
}
.metric-unit {
  font-size: 14px;
  color: var(--lark-fg-soft);
  font-weight: var(--lark-w-medium);
}

.metric-delta {
  font-size: 12px;
  font-weight: var(--lark-w-semibold);
  margin-top: 2px;
}
.metric-delta.up { color: var(--lark-teal); }
.metric-delta.down { color: var(--lark-danger); }

/* Map/flow card */
.flow-card {
  margin-top: 24px;
  padding: 24px 28px;
  background: rgba(255,255,255,0.025);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 14px;
}

.flow-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 18px;
}

.flow-title {
  font-size: 16px;
  font-weight: var(--lark-w-semibold);
  color: var(--lark-fg-white);
}

.flow-title-sub {
  font-size: 12px;
  color: var(--lark-fg-quiet);
  letter-spacing: 0.04em;
  margin-top: 3px;
}

.flow-legend {
  display: flex; gap: 14px; font-size: 11px; color: var(--lark-fg-quiet);
}

.flow-legend-item { display: inline-flex; align-items: center; gap: 6px; }
.flow-legend-dot { width: 8px; height: 8px; border-radius: 50%; }

/* Sankey-ish flow */
.flow-svg { width: 100%; height: 220px; }

/* Day-by-day forecast bars */
.forecast {
  margin-top: 20px;
  padding-top: 20px;
  border-top: 1px solid rgba(255,255,255,0.06);
}

.forecast-head {
  display: flex; align-items: center; justify-content: space-between;
  font-size: 12px; color: var(--lark-fg-quiet);
  margin-bottom: 10px;
}

.forecast-row {
  display: grid;
  grid-template-columns: 60px 1fr 80px 100px;
  align-items: center;
  gap: 12px;
  padding: 8px 0;
  border-bottom: 1px dashed rgba(255,255,255,0.06);
  font-size: 13px;
}
.forecast-row:last-child { border-bottom: 0; }

.forecast-day {
  color: var(--lark-fg-white);
  font-weight: var(--lark-w-medium);
}
.forecast-day-sub {
  color: var(--lark-fg-quiet);
  font-size: 11px;
  margin-top: 2px;
}

.forecast-bar-track {
  height: 8px;
  background: rgba(255,255,255,0.06);
  border-radius: 4px;
  position: relative;
  overflow: hidden;
}
.forecast-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--lark-blue) 0%, var(--lark-cyan) 100%);
  border-radius: 4px;
  position: relative;
}

.forecast-num {
  text-align: right;
  font-variant-numeric: tabular-nums;
  font-weight: var(--lark-w-semibold);
  color: var(--lark-fg-white);
}

.forecast-source {
  font-size: 11px;
  color: var(--lark-fg-quiet);
}

/* Inline signals strip (sources) */
.source-strip {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 18px;
}

.source-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 10px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 999px;
  font-size: 11px;
  color: var(--lark-fg-soft);
  letter-spacing: 0.02em;
}

.source-chip-dot {
  width: 6px; height: 6px; border-radius: 50%; background: var(--lark-teal);
}

/* ---------- Response column ---------- */

.col-response .col-header { padding-top: 18px; }

.response-list {
  padding: 4px 22px 24px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.pack-card {
  background: linear-gradient(180deg, rgba(255,255,255,0.035) 0%, rgba(255,255,255,0.015) 100%);
  border: 1px solid rgba(255,255,255,0.10);
  border-radius: 12px;
  overflow: hidden;
}

.pack-head {
  display: flex; align-items: center; gap: 10px;
  padding: 14px 16px;
  border-bottom: 1px solid rgba(255,255,255,0.06);
}

.pack-icon {
  width: 36px; height: 36px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 8px;
  flex-shrink: 0;
}

.pack-icon.sku { background: rgba(60,127,255,0.15); color: var(--lark-blue); }
.pack-icon.display { background: rgba(51,214,192,0.12); color: var(--lark-teal); }
.pack-icon.ba { background: rgba(159,111,241,0.15); color: var(--lark-violet); }
.pack-icon.content { background: rgba(254,127,0,0.12); color: var(--lark-orange); }

.pack-title-wrap { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.pack-title {
  font-size: 15px;
  font-weight: var(--lark-w-semibold);
  color: var(--lark-fg-white);
}
.pack-title-sub {
  font-size: 11px;
  color: var(--lark-fg-quiet);
  letter-spacing: 0.04em;
}

.pack-count {
  font-size: 11px;
  color: var(--lark-fg-soft);
  background: rgba(255,255,255,0.06);
  padding: 3px 8px;
  border-radius: 999px;
}

.pack-body {
  padding: 12px 16px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.pack-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  border-radius: 8px;
  background: rgba(0,0,0,0.20);
  border: 1px solid rgba(255,255,255,0.04);
  font-size: 13px;
  color: var(--lark-fg-white);
  line-height: 1.4;
}

.pack-item-check {
  width: 16px; height: 16px;
  border-radius: 4px;
  border: 1.5px solid rgba(255,255,255,0.30);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  cursor: pointer;
  transition: all .15s var(--lark-ease);
}
.pack-item-check.checked {
  background: var(--lark-blue);
  border-color: var(--lark-blue);
}

.pack-item-text {
  flex: 1;
  font-weight: var(--lark-w-medium);
}

.pack-item-text .ghost { color: var(--lark-fg-quiet); font-weight: 400; }
.pack-item-text .hl { color: var(--lark-cyan); }

.pack-item-tag {
  font-size: 10px;
  padding: 2px 6px;
  border-radius: 4px;
  letter-spacing: 0.04em;
  flex-shrink: 0;
}
.pack-item-tag.urgent { color: var(--lark-orange); background: rgba(254,127,0,0.10); }
.pack-item-tag.auto { color: var(--lark-teal); background: rgba(51,214,192,0.10); }
.pack-item-tag.new { color: var(--lark-cyan); background: rgba(36,195,255,0.10); }

/* Rep chips */
.ba-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  padding: 4px 0;
}
.ba-chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 10px;
  background: rgba(159,111,241,0.10);
  border: 1px solid rgba(159,111,241,0.25);
  border-radius: 999px;
  font-size: 12px;
  color: var(--lark-fg-white);
}
.ba-chip-avatar {
  width: 20px; height: 20px;
  border-radius: 50%;
  background: linear-gradient(135deg, #9F6FF1, #5C3FFB);
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; font-weight: var(--lark-w-semibold);
  color: white;
}

/* ---------- Approval footer ---------- */

.approve-bar {
  position: sticky;
  bottom: 0;
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 18px 28px;
  background: linear-gradient(180deg, rgba(4,6,15,0.0) 0%, rgba(4,6,15,0.92) 35%);
  border-top: 1px solid rgba(255,255,255,0.06);
  margin-top: auto;
}

.approve-meta {
  display: flex;
  align-items: center;
  gap: 16px;
}

.approve-meta-block {
  display: flex; flex-direction: column; gap: 2px;
}
.approve-meta-l { font-size: 11px; color: var(--lark-fg-quiet); letter-spacing: 0.04em; }
.approve-meta-v { font-size: 14px; color: var(--lark-fg-white); font-weight: var(--lark-w-medium); }

.approve-status {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 8px 14px;
  background: rgba(254,127,0,0.10);
  border: 1px solid rgba(254,127,0,0.35);
  color: var(--lark-orange);
  border-radius: 999px;
  font-size: 13px;
  font-weight: var(--lark-w-semibold);
}

.approve-spacer { flex: 1; }

.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 10px 18px;
  font-size: 14px;
  font-weight: var(--lark-w-semibold);
  border-radius: 8px;
  cursor: pointer;
  border: 1px solid transparent;
  transition: all .15s var(--lark-ease);
  font-family: var(--lark-font-sans);
  letter-spacing: 0.02em;
}
.btn:active { transform: scale(0.98); }

.btn-secondary {
  background: rgba(255,255,255,0.06);
  border-color: rgba(255,255,255,0.10);
  color: var(--lark-fg-white);
}
.btn-secondary:hover { background: rgba(255,255,255,0.10); }

.btn-primary {
  background: var(--lark-blue);
  color: white;
  box-shadow: 0 0 0 1px rgba(60,127,255,0.20), 0 0 24px rgba(60,127,255,0.30);
}
.btn-primary:hover { background: var(--lark-blue-500); }

.btn-ghost {
  background: transparent;
  color: var(--lark-fg-soft);
  border-color: rgba(255,255,255,0.10);
}
.btn-ghost:hover { color: var(--lark-fg-white); }

/* ---------- Scrollbars ---------- */

::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.16); }

/* ---------- Modal / Drawer ---------- */

.modal-backdrop {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.65);
  backdrop-filter: blur(6px);
  z-index: 200;
  display: flex; align-items: center; justify-content: center;
  animation: fadeIn .2s ease;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.modal {
  width: 560px;
  background: linear-gradient(180deg, #0A1230 0%, #060B22 100%);
  border: 1px solid rgba(255,255,255,0.10);
  border-radius: 14px;
  padding: 28px;
  box-shadow: 0 30px 80px rgba(0,0,0,0.6);
}

.modal-title { font-size: 22px; font-weight: var(--lark-w-semibold); color: var(--lark-fg-white); margin: 0 0 8px; }
.modal-sub { font-size: 14px; color: var(--lark-fg-soft); margin: 0 0 18px; }

.modal-summary {
  background: rgba(0,0,0,0.30);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 10px;
  padding: 14px;
  display: flex; flex-direction: column; gap: 8px;
  font-size: 13px;
}
.modal-summary-row { display: flex; justify-content: space-between; }
.modal-summary-row .lbl { color: var(--lark-fg-quiet); }
.modal-summary-row .val { color: var(--lark-fg-white); font-weight: var(--lark-w-medium); }

.modal-actions { display: flex; gap: 10px; margin-top: 18px; justify-content: flex-end; }

/* Toast */
.toast {
  position: fixed;
  bottom: 100px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(51,214,192,0.15);
  border: 1px solid rgba(51,214,192,0.40);
  color: var(--lark-fg-white);
  padding: 14px 22px;
  border-radius: 10px;
  font-size: 14px;
  font-weight: var(--lark-w-medium);
  box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  z-index: 300;
  display: flex;
  align-items: center;
  gap: 10px;
  animation: toastIn .25s var(--lark-ease-out);
}
@keyframes toastIn { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translate(-50%, 0); } }

.toast-icon {
  width: 22px; height: 22px;
  background: var(--lark-teal);
  color: #04060F;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-weight: var(--lark-w-bold);
}

/* timeline post-approval */
.timeline {
  margin-top: 18px;
  padding: 16px;
  background: rgba(0,0,0,0.25);
  border: 1px solid rgba(51,214,192,0.20);
  border-radius: 10px;
}
.timeline-head { font-size: 13px; font-weight: var(--lark-w-semibold); margin-bottom: 10px; color: var(--lark-teal); letter-spacing: 0.04em; }
.timeline-row { display: flex; gap: 10px; padding: 6px 0; font-size: 12px; color: var(--lark-fg-soft); }
.timeline-time { color: var(--lark-fg-quiet); font-variant-numeric: tabular-nums; width: 60px; flex-shrink: 0; }
.timeline-dot {
  width: 8px; height: 8px; border-radius: 50%; background: var(--lark-teal); margin-top: 5px; flex-shrink: 0;
  box-shadow: 0 0 0 3px rgba(51,214,192,0.20);
}

/* ---------- Store floor plan ---------- */

.floor-card {
  background: rgba(255,255,255,0.025);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 14px;
  padding: 22px 24px;
  margin-bottom: 16px;
}

.section-head {
  display: flex; align-items: flex-end; justify-content: space-between;
  margin-bottom: 16px;
  gap: 14px;
}

.section-head-l {
  display: flex; flex-direction: column; gap: 4px;
}

.section-title {
  font-size: 18px;
  font-weight: var(--lark-w-semibold);
  color: var(--lark-fg-white);
}

.section-sub {
  font-size: 12px;
  color: var(--lark-fg-quiet);
  letter-spacing: 0.04em;
}

.section-head-r {
  display: flex; gap: 6px; align-items: center;
}

.floor-toggle {
  display: inline-flex;
  align-items: center;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 8px;
  overflow: hidden;
}
.floor-toggle button {
  padding: 6px 12px;
  font-size: 12px;
  background: transparent;
  border: 0;
  color: var(--lark-fg-quiet);
  cursor: pointer;
  font-family: inherit;
  border-right: 1px solid rgba(255,255,255,0.06);
}
.floor-toggle button:last-child { border-right: 0; }
.floor-toggle button.active {
  background: rgba(60,127,255,0.20);
  color: var(--lark-fg-white);
}

.floor-svg-wrap {
  position: relative;
  background: linear-gradient(180deg, #060B22 0%, #03050E 100%);
  border-radius: 10px;
  overflow: hidden;
  border: 1px solid rgba(255,255,255,0.05);
}

.floor-svg { width: 100%; display: block; }

.floor-legend {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  margin-top: 12px;
  font-size: 12px;
  color: var(--lark-fg-quiet);
}

.floor-legend-item { display: inline-flex; align-items: center; gap: 6px; }

.legend-marker {
  width: 14px; height: 14px;
  border-radius: 4px;
}

.legend-marker.update { background: rgba(60,127,255,0.30); border: 1px solid var(--lark-blue); }
.legend-marker.new { background: rgba(254,127,0,0.25); border: 1px solid var(--lark-orange); }
.legend-marker.boost { background: rgba(51,214,192,0.25); border: 1px solid var(--lark-teal); }
.legend-marker.heat { background: linear-gradient(180deg, rgba(254,127,0,0.5), rgba(60,127,255,0.5)); }

/* ---------- Rep schedule grid ---------- */

.ba-grid-card {
  background: rgba(255,255,255,0.025);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 14px;
  padding: 22px 24px;
  margin-bottom: 16px;
}

.ba-grid {
  display: grid;
  grid-template-columns: 130px 1fr;
  gap: 4px 12px;
  margin-top: 10px;
  font-size: 12px;
}

.ba-grid-head {
  display: grid;
  grid-template-columns: 130px 1fr;
  gap: 12px;
  font-size: 11px;
  color: var(--lark-fg-quiet);
  letter-spacing: 0.04em;
  margin-bottom: 8px;
}

.ba-hours {
  display: grid;
  grid-template-columns: repeat(13, 1fr);
  gap: 2px;
  font-size: 10px;
  color: var(--lark-fg-quiet);
  font-variant-numeric: tabular-nums;
}

.ba-row {
  display: grid;
  grid-template-columns: 130px 1fr;
  gap: 12px;
  align-items: center;
  padding: 5px 0;
  border-bottom: 1px dashed rgba(255,255,255,0.06);
}
.ba-row:last-child { border-bottom: 0; }

.ba-row-name {
  display: flex; align-items: center; gap: 8px;
  font-size: 13px; color: var(--lark-fg-white);
  font-weight: var(--lark-w-medium);
}

.ba-row-name .lvl {
  font-size: 10px;

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────

// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.

// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.

  );
  React.useEffect(() => {
    if (!hasDeckStage || railEnabled) return undefined;
    const onMsg = (e) => {
      if (e.data && e.data.type === '__omelette_rail_enabled') setRailEnabled(true);
    };
    window.addEventListener('message', onMsg);
    return () => window.removeEventListener('message', onMsg);
  }, [hasDeckStage, railEnabled]);
  const [railVisible, setRailVisible] = React.useState(() => {
    try { return localStorage.getItem('deck-stage.railVisible') !== '0'; } catch (e) { return true; }
  });
  const toggleRail = (on) => {
    setRailVisible(on);
    window.postMessage({ type: '__deck_rail_visible', on }, '*');
  };
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-noncommentable=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
          {hasDeckStage && railEnabled && !noDeckControls && (
            <TweakSection label="Deck">
              <TweakToggle label="Thumbnail rail" value={railVisible} onChange={toggleRail} />
            </TweakSection>
          )}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

  </script>

  <script type="text/babel" data-presets="react">
/* Main app shell */
/* eslint-disable */

const { useState, useEffect, useMemo, useRef } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "scenario": "korea",
  "showSubBar": true,
  "compactSignals": false,
  "showSpeakerHints": false
}/*EDITMODE-END*/;

function useClock() {
  const [t, setT] = useState(() => new Date());
  useEffect(() => {
    const id = setInterval(() => setT(new Date()), 1000);
    return () => clearInterval(id);
  }, []);
  const pad = n => String(n).padStart(2, "0");
  return `2026-05-15  ${pad(t.getHours())}:${pad(t.getMinutes())}:${pad(t.getSeconds())}`;
}

function Topbar() {
  const clock = useClock();
  return (
    <div className="topbar">
      <div className="brand">
        <div className="brand-logo" style={{display:"flex",alignItems:"center",justifyContent:"center",fontWeight:800,color:"#0A63C7",fontSize:14}}>青啤</div>
        <div className="brand-text">
          <span className="brand-name-zh">青岛啤酒</span>
          <span className="brand-name-en">Tsingtao Brewery</span>
        </div>
      </div>

      <div className="product-title">
        <span className="product-title-zh">超级操作员控制台</span>
        <span className="product-title-tag">TSINGTAO · AI Operator</span>
      </div>

      <div className="topbar-spacer"></div>

      <div className="topbar-meta">
        <span className="live-pulse">
          <span className="live-dot"></span>
          实时信号 · 接入 12 路
        </span>
        <span className="topbar-clock">{clock}</span>
        <span className="topbar-user">
          <span className="topbar-avatar">范</span>
          <span>李海峰 · 青岛啤酒</span>
          <IChevronDown size={14} stroke={2} />
        </span>
      </div>
    </div>
  );
}

function SubBar({ S, tab, setTab }) {
  const tabs = [
    { k: "ops", label: "终端操盘", badge: 4 },
    { k: "review", label: "复盘沉淀" },
    { k: "library", label: "知识库" },
    { k: "logs", label: "执行日志" },
  ];
  return (
    <div className="subbar">
      {tabs.map(t => (
        <span
          key={t.k}
          className={`subbar-tab ${tab === t.k ? "active" : ""}`}
          onClick={() => setTab(t.k)}
        >
          {t.label}
          {t.badge && <span className="tab-badge">{t.badge}</span>}
          {t.dot && <span className="tab-dot"></span>}
        </span>
      ))}

      <div className="subbar-store">
        <span style={{ color: "var(--lark-fg-quiet)" }}>当前场景</span>
        <span className="subbar-store-chip">
          <IMapPin size={12} />
          {S.store} · {S.storeShort}
          <IChevronDown size={12} stroke={2} />
        </span>
      </div>
    </div>
  );
}

function ConfirmModal({ S, checks, onClose, onConfirm }) {
  const counts = useMemo(() => {
    let sku = 0, disp = 0, ba = 0, ct = 0;
    Object.entries(checks).forEach(([k, v]) => {
      if (!v) return;
      if (k.startsWith("sku-")) sku++;
      else if (k.startsWith("disp-")) disp++;
      else if (k.startsWith("ba-")) ba++;
      else if (k.startsWith("ct-")) ct++;
    });
    return { sku, disp, ba, ct, total: sku + disp + ba + ct };
  }, [checks]);

  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal" onClick={e => e.stopPropagation()}>
        <h2 className="modal-title">飞书审批 · 一键下发</h2>
        <p className="modal-sub">将向 {S.store} 店长 <b style={{ color: "var(--lark-fg-white)" }}>李海涛</b> 发起飞书审批，通过后各动作自动分发至对应责任人。</p>

        <div className="modal-summary">
          <div className="modal-summary-row"><span className="lbl">客群目标</span><span className="val">{S.country}客群 · 未来 72h 预估 {S.metrics[0].num} 人</span></div>
          <div className="modal-summary-row"><span className="lbl">选品调整</span><span className="val">{counts.sku} 项</span></div>
          <div className="modal-summary-row"><span className="lbl">陈列 / 物料</span><span className="val">{counts.disp} 项</span></div>
          <div className="modal-summary-row"><span className="lbl">代表调度</span><span className="val">{counts.ba} 项</span></div>
          <div className="modal-summary-row"><span className="lbl">内容 / 落地页</span><span className="val">{counts.ct} 项</span></div>
          <div className="modal-summary-row" style={{ paddingTop: 8, borderTop: "1px dashed rgba(255,255,255,0.10)", marginTop: 4 }}>
            <span className="lbl">合计动作</span>
            <span className="val" style={{ color: "var(--lark-teal)", fontSize: 16 }}>{counts.total} 项 · 落地后 48h 自动复盘</span>
          </div>
        </div>

        <div className="modal-actions">
          <button className="btn btn-ghost" onClick={onClose}>取消</button>
          <button className="btn btn-primary" onClick={onConfirm}>
            <ICheck size={14} stroke={2.4} />
            下发到飞书审批
          </button>
        </div>
      </div>
    </div>
  );
}

function ApproveBar({ S, checks, onSubmit, executed }) {
  const total = Object.values(checks).filter(Boolean).length;
  return (
    <div className="approve-bar">
      <div className="approve-meta">
        <div className="approve-meta-block">
          <span className="approve-meta-l">应对场景</span>
          <span className="approve-meta-v">{S.country}客群 · 72h 应对包</span>
        </div>
        <div className="approve-meta-block">
          <span className="approve-meta-l">选中动作</span>
          <span className="approve-meta-v">{total} 项</span>
        </div>
        <div className="approve-meta-block">
          <span className="approve-meta-l">预计执行窗口</span>
          <span className="approve-meta-v">5/16 14:00 — 5/20 23:00</span>
        </div>
      </div>

      <div className="approve-spacer"></div>

      {executed ? (
        <span className="approve-status" style={{ background: "rgba(51,214,192,0.10)", borderColor: "rgba(51,214,192,0.35)", color: "var(--lark-teal)" }}>
          <ICheck size={14} stroke={2.4} />
          已审批 · 执行中
        </span>
      ) : (
        <span className="approve-status">
          <IClock size={14} />
          待店长审批
        </span>
      )}

      <button className="btn btn-secondary">
        <IFileText size={14} />
        导出 PDF 简报
      </button>
      <button className="btn btn-secondary">
        <IRefreshCw size={14} />
        重新生成
      </button>
      <button className="btn btn-primary" onClick={onSubmit} disabled={executed} style={executed ? { opacity: 0.4, cursor: "default" } : {}}>
        <IZap size={14} stroke={2.4} />
        一键下发 · 飞书审批
      </button>
    </div>
  );
}

function buildDefaultChecks(S) {
  const c = {};
  S.sku.forEach((it, i) => { if (it.tag === "urgent" || it.tag === "auto") c[`sku-${i}`] = true; });
  S.display.forEach((it, i) => { if (it.tag === "urgent" || it.tag === "auto") c[`disp-${i}`] = true; });
  S.baActions.forEach((it, i) => { if (it.tag === "auto") c[`ba-${i}`] = true; });
  S.content.forEach((it, i) => { if (it.tag === "auto" || it.tag === "new") c[`ct-${i}`] = true; });
  return c;
}

function App() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const S = SCENARIOS[tweaks.scenario] || SCENARIOS.korea;

  const [tab, setTab] = useState("ops");
  const [checks, setChecks] = useState(() => buildDefaultChecks(S));
  const [showModal, setShowModal] = useState(false);
  const [executed, setExecuted] = useState(false);
  const [toast, setToast] = useState(null);
  const [timeline, setTimeline] = useState([]);

  // Reset on scenario change
  useEffect(() => {
    setChecks(buildDefaultChecks(S));
    setExecuted(false);
    setTimeline([]);
  }, [tweaks.scenario]);

  const onConfirm = () => {
    setShowModal(false);
    setExecuted(true);
    setToast(`已下发 ${Object.values(checks).filter(Boolean).length} 项动作 · 店长李海涛飞书审批已通过`);
    // Animate timeline rows
    const steps = [
      { time: "09:33", text: "飞书审批 · 店长李海涛 · 已通过 ✓" },
      { time: "09:34", text: `选品组合同步至 ERP · 主推 SKU 已切换至${S.country}精选` },
      { time: "09:36", text: "陈列方案推送至 1F 店务组 · 韩文价签打印任务已派" },
      { time: "09:38", text: `${S.bas.length} 位业务代表收到话术包 + 路线调整通知` },
      { time: "09:42", text: "小红书 / 社媒内容已进入审核排期 · 预计 11:00 发布" },
      { time: "09:45", text: "AI 复盘机制已就位 · 48h 后自动产出对比报告" },
    ];
    let i = 0;
    const id = setInterval(() => {
      setTimeline(t => [...t, steps[i]]);
      i++;
      if (i >= steps.length) clearInterval(id);
    }, 400);
    setTimeout(() => setToast(null), 4200);
  };

  return (
    <div className="app-shell">
      <Topbar />
      {tweaks.showSubBar && <SubBar S={S} tab={tab} setTab={setTab} />}

      {tab === "ops" && (
        <>
          <BriefBanner S={S} executed={executed} />
          <div className="main">
            <OperatorCenter S={S} executed={executed} timeline={timeline} />
            <ResponseColumn S={S} checks={checks} setChecks={setChecks} />
          </div>
          <ApproveBar S={S} checks={checks} onSubmit={() => setShowModal(true)} executed={executed} />
        </>
      )}

      {tab === "review" && <ReviewPage />}

      {tab === "library" && <StubPage title="知识库" sub="跨场景共享的终端画像、价盘规则、陈列标准、话术模板。" />}
      {tab === "logs" && <StubPage title="执行日志" sub="每一次下发的动作及其执行链路、责任人、状态。" />}

      {showModal && (
        <ConfirmModal
          S={S}
          checks={checks}
          onClose={() => setShowModal(false)}
          onConfirm={onConfirm}
        />
      )}

      {toast && (
        <div className="toast">
          <span className="toast-icon"><ICheck size={12} stroke={3.2} /></span>
          {toast}
        </div>
      )}

      <Tweaks tweaks={tweaks} setTweak={setTweak} />
    </div>
  );
}

function StubPage({ title, sub }) {
  return (
    <div style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center", flexDirection: "column", gap: 12, padding: 80, color: "var(--lark-fg-quiet)" }}>
      <div style={{ fontSize: 32, color: "var(--lark-fg-white)", fontWeight: 600 }}>{title}</div>
      <div style={{ fontSize: 14 }}>{sub}</div>
      <div style={{ marginTop: 16, padding: "8px 14px", border: "1px dashed rgba(255,255,255,0.20)", borderRadius: 6, fontSize: 12, letterSpacing: "0.06em" }}>暂为占位 · 下一版本启用</div>
    </div>

}

function Tweaks({ tweaks, setTweak }) {

    <TweaksPanel title="Tweaks">

            { value: "korea", label: "龙虾夜宵" },

            { value: "russia", label: "价盘防守" },
          ]}
        />
      </TweakSection>
      <TweakSection label="界面">
        <TweakToggle label="显示子导航栏" value={tweaks.showSubBar} onChange={v => setTweak("showSubBar", v)} />
      </TweakSection>
    </TweaksPanel>
  );
}
