<style>
/* ============================================================
   Lark PPT — Foundations: Colors & Type (inlined)
   ============================================================ */
:root {
  --lark-bg-black:    #000000;
  --lark-bg-deep:     #04060F;
  --lark-bg-navy:     #0A1230;
  --lark-bg-twilight: #1B1F3A;
  --lark-fg-white:    #FFFFFF;
  --lark-fg-muted:    #E7E6E6;
  --lark-fg-soft:     rgba(255,255,255,0.72);
  --lark-fg-quiet:    rgba(255,255,255,0.48);
  --lark-fg-faint:    rgba(255,255,255,0.16);
  --lark-ink:         #1F2329;
  --lark-ink-2:       #51565D;
  --lark-ink-3:       #8F959E;
  --lark-ink-4:       #BBBFC4;
  --lark-line:        #DEE0E3;
  --lark-surface:     #FFFFFF;
  --lark-surface-2:   #F5F6F7;
  --lark-surface-3:   #EFF0F1;
  --lark-neutral-700: #767171;
  --lark-neutral-200: #E7E6E6;
  --lark-blue:    #3C7FFF;
  --lark-cyan:    #24C3FF;
  --lark-purple:  #5C3FFB;
  --lark-teal:    #33D6C0;
  --lark-violet:  #9F6FF1;
  --lark-orange:  #FE7F00;
  --lark-blue-50:  #EAF1FF;
  --lark-blue-100: #C9DCFF;
  --lark-blue-200: #9DBEFF;
  --lark-blue-300: #6A9DFF;
  --lark-blue-400: #3C7FFF;
  --lark-blue-500: #2566EC;
  --lark-blue-600: #0057F9;
  --lark-blue-700: #003FB8;
  --lark-link:           #3C7FFF;
  --lark-link-visited:   #0057F9;
  --lark-success:        #33D6C0;
  --lark-warning:        #FE7F00;
  --lark-danger:         #F54A45;
  --lark-info:           #24C3FF;
  --lark-grad-hero:
    radial-gradient(120% 100% at 0% 0%, #0F1A4A 0%, #060B22 38%, #000 78%);
  --lark-grad-section:
    radial-gradient(140% 110% at 100% 0%, #1A2256 0%, #050817 50%, #000 100%);
  --lark-grad-brand:
    linear-gradient(135deg, #33D6C0 0%, #3C7FFF 50%, #1A1F6B 100%);
  --lark-grad-keyline:
    linear-gradient(90deg, #33D6C0 0%, #3C7FFF 50%, #5C3FFB 100%);
  --lark-font-sans:
    "Noto Sans SC", "FZLanTingHeiPro_GB18030",
    "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB",
    "Helvetica Neue", Arial, sans-serif;
  --lark-font-latin:
    "Inter", "Helvetica Neue", Arial, "Noto Sans SC", sans-serif;
  --lark-font-mono:
    "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
  --lark-w-light:    300;
  --lark-w-regular:  400;
  --lark-w-medium:   500;
  --lark-w-semibold: 600;
  --lark-w-bold:     700;
  --lark-w-black:    900;
  --lark-ease:          cubic-bezier(0.4, 0, 0.2, 1);
  --lark-ease-out:      cubic-bezier(0.0, 0, 0.2, 1);
  --lark-ease-spring:   cubic-bezier(0.34, 1.56, 0.64, 1);
  --lark-dur-fast:      120ms;
  --lark-dur-base:      200ms;
  --lark-dur-slow:      400ms;
}

/* ============================================================
   App styles (inlined)
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; background: transparent; }
body {
  font-family: var(--lark-font-sans);
  color: var(--lark-ink);
  background: transparent;
  font-size: 16px;
  line-height: 1.5;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
button { font: inherit; border: none; background: none; cursor: pointer; color: inherit; padding: 0; }
button:focus-visible { outline: 2px solid var(--lark-blue); outline-offset: 2px; }

.stage {
  position: fixed; inset: 0;
  display: flex; align-items: center; justify-content: center;
  background: transparent;
  overflow: hidden;
}
.stage-canvas {
  width: 1440px;
  height: 900px;
  transform-origin: center center;
  background: var(--lark-surface-2);
  position: relative;
  flex-shrink: 0;
}
#root { width: 100%; height: 100%; display: block; }

.app {
  display: grid;
  grid-template-columns: 1fr;
  height: 100%;
  width: 100%;
}

.rail {
  background: #1F2329;
  display: flex; flex-direction: column; align-items: center;
  padding: 14px 0; gap: 10px;
}
.rail .ws { width: 40px; height: 40px; border-radius: 9px; overflow: hidden;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; opacity: 0.55; transition: 0.15s; position: relative; }
.rail .ws:hover { opacity: 1; }
.rail .ws.active { opacity: 1; outline: 2px solid var(--lark-blue); outline-offset: 2px; }
.rail .ws img { width: 100%; height: 100%; object-fit: contain; background: #000; padding: 6px; }
.rail .ws .glyph {
  width: 100%; height: 100%;
  display:flex; align-items:center; justify-content:center;
  color:#fff; font-weight:700; font-size:15px;
  background: linear-gradient(135deg, #3C7FFF 0%, #5C3FFB 100%);
}
.rail .ws.intel .glyph { background: linear-gradient(135deg, #33D6C0 0%, #3C7FFF 60%, #1A1F6B 100%); font-size: 13px; letter-spacing: -0.02em; }
.rail .ws-add { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.55);
                font-size: 20px; line-height: 1; }
.rail .ws-add:hover { background: rgba(255,255,255,0.1); color: #fff; }
.rail .spacer { flex: 1; }
.rail .me { width: 40px; height: 40px; border-radius: 999px;
            background: #FE7F00; color: #fff; font-weight: 600; font-size: 14px;
            display: flex; align-items: center; justify-content: center; }

.main {
  display: grid;
  grid-template-rows: 64px auto 1fr;
  min-width: 0;
  min-height: 0;
}

.topbar {
  background: #fff;
  border-bottom: 1px solid var(--lark-line);
  display: flex; align-items: center;
  padding: 0 28px;
  gap: 24px;
}
.topbar .brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
.topbar .ctg-logo {
  height: 38px;
  width: auto;
  display: block;
  object-fit: contain;
}
.topbar .brand-divider {
  width: 1px; height: 22px;
  background: rgba(255,255,255,0.16);
  flex-shrink: 0;
}
.topbar .brand-name { font-size: 17px; font-weight: 600; color: var(--lark-ink); }
.topbar .tabs { display: flex; gap: 4px; margin-left: 24px; }
.tab {
  padding: 8px 14px; border-radius: 6px;
  font-size: 14px; font-weight: 500; color: var(--lark-ink-2);
  transition: 0.12s;
}
.tab:hover { background: var(--lark-surface-3); color: var(--lark-ink); }
.tab.active { background: rgba(60,127,255,0.10); color: var(--lark-blue-500); font-weight: 600; }
.topbar .spacer { flex: 1; }
.topbar .top-right { display: flex; align-items: center; gap: 14px; }
.search {
  display: flex; align-items: center; gap: 8px;
  background: var(--lark-surface-2);
  border: 1px solid var(--lark-line);
  border-radius: 8px;
  padding: 6px 12px;
  width: 240px;
  color: var(--lark-ink-3);
  font-size: 13px;
}
.icon-btn {
  width: 34px; height: 34px; border-radius: 8px;
  color: var(--lark-ink-2);
  display: flex; align-items: center; justify-content: center;
  transition: 0.12s;
}
.icon-btn:hover { background: var(--lark-surface-3); color: var(--lark-ink); }
.icon-btn .dot { position: absolute; width: 8px; height: 8px; border-radius: 999px; background: #F54A45; margin-top: -10px; margin-left: 8px; border: 1.5px solid #fff; }

.me-chip {
  width: 34px; height: 34px; border-radius: 999px;
  background: linear-gradient(135deg, #FE7F00 0%, #F54A45 100%);
  color: #fff; font-weight: 600; font-size: 14px;
  display: flex; align-items: center; justify-content: center;
  margin-left: 6px;
  cursor: pointer;
}

.hero {
  background:
    radial-gradient(120% 100% at 0% 0%, #0F1A4A 0%, #060B22 38%, #04060F 78%);
  color: #fff;
  padding: 24px 36px 24px;
  display: grid;
  grid-template-columns: 1.2fr 1.4fr;
  gap: 32px;
  align-items: stretch;
  position: relative;
  overflow: hidden;
}
.hero::after {
  content: '';
  position: absolute; inset: 0;
  background: radial-gradient(60% 100% at 100% 0%, rgba(51,214,192,0.15), transparent 60%);
  pointer-events: none;
}
.hero-left, .hero-right { position: relative; z-index: 1; }
.hero-eyebrow {
  font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase;
  font-weight: 600; color: var(--lark-teal);
  display: flex; align-items: center; gap: 10px;
}
.hero-eyebrow .pulse {
  width: 8px; height: 8px; border-radius: 999px; background: var(--lark-teal);
  box-shadow: 0 0 0 0 rgba(51,214,192, 0.7);
  animation: pulse 2s infinite;
}
@keyframes pulse {
  0% { box-shadow: 0 0 0 0 rgba(51,214,192, 0.7); }
  70% { box-shadow: 0 0 0 10px rgba(51,214,192, 0); }
  100% { box-shadow: 0 0 0 0 rgba(51,214,192, 0); }
}
.hero h1 {
  margin: 10px 0 0;
  font-size: 32px; line-height: 1.18; font-weight: 700;
  letter-spacing: -0.01em;
}
.hero .hero-sub {
  margin-top: 10px;
  font-size: 15px; color: rgba(255,255,255,0.65); font-weight: 400;
  max-width: 520px;
}
.hero-meta {
  margin-top: 16px;
  display: flex; gap: 18px; align-items: center;
  font-size: 13px; color: rgba(255,255,255,0.55);
}
.hero-meta b { color: #fff; font-weight: 600; }
.hero-meta .chip {
  padding: 3px 10px; border-radius: 999px;
  background: rgba(255,255,255,0.08); color: #fff;
  font-weight: 500; font-size: 12px;
}

.kpis {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
}
.kpi {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 10px;
  padding: 14px 16px;
  display: flex; flex-direction: column;
  gap: 4px;
  min-width: 0;
}
.kpi .k-label {
  font-size: 11px; letter-spacing: 0.10em; text-transform: uppercase;
  color: rgba(255,255,255,0.55); font-weight: 600;
}
.kpi .k-val {
  font-family: var(--lark-font-latin);
  font-size: 34px; font-weight: 700; color: #fff; line-height: 1;
  margin-top: 4px;
  letter-spacing: -0.02em;
}
.kpi .k-unit { font-size: 14px; color: rgba(255,255,255,0.55); margin-left: 4px; font-weight: 500; }
.kpi .k-foot {
  margin-top: 4px;
  font-size: 12px; color: rgba(255,255,255,0.55);
  display: flex; align-items: center; gap: 6px;
}

.body-grid {
  display: grid;
  grid-template-columns: 1fr 340px;
  gap: 20px;
  padding: 20px 28px 28px;
  overflow: hidden;
  min-height: 0;
}
.col-main {
  overflow-y: auto;
  padding-right: 4px;
  display: flex; flex-direction: column; gap: 20px;
  min-height: 0;
}
.col-right {
  overflow-y: auto;
  display: flex; flex-direction: column; gap: 16px;
  min-height: 0;
}

.section-head {
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 12px;
}
.section-head .dot {
  width: 10px; height: 10px; border-radius: 999px;
}
.section-head .dot.r { background: #F54A45; box-shadow: 0 0 0 4px rgba(245,74,69,0.16); }
.section-head .dot.y { background: #FE7F00; box-shadow: 0 0 0 4px rgba(254,127,0,0.16); }
.section-head .dot.g { background: #33D6C0; box-shadow: 0 0 0 4px rgba(51,214,192,0.16); }
.section-head h2 {
  margin: 0;
  font-size: 18px; font-weight: 600; color: var(--lark-ink);
}
.section-head .count {
  background: var(--lark-surface-3);
  color: var(--lark-ink-2);
  font-size: 12px; font-weight: 600;
  padding: 3px 10px; border-radius: 999px;
  font-family: var(--lark-font-latin);
}
.section-head .sub {
  font-size: 13px; color: var(--lark-ink-3);
  margin-left: 4px;
}
.section-head .spacer { flex: 1; }
.section-head .more {
  font-size: 13px; color: var(--lark-blue-500); font-weight: 500;
}

.high-cards {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 14px;
}
.lead-card {
  background: #fff;
  border: 1px solid var(--lark-line);
  border-radius: 10px;
  padding: 18px 20px;
  display: flex; flex-direction: column; gap: 10px;
  cursor: pointer;
  transition: 0.15s;
  position: relative;
}
.lead-card:hover {
  border-color: rgba(60,127,255,0.4);
  box-shadow: 0 4px 14px rgba(31, 35, 41, 0.08);
}
.lead-card.active {
  border-color: var(--lark-blue);
  box-shadow: 0 0 0 1px var(--lark-blue), 0 6px 18px rgba(60,127,255,0.18);
}
.lead-card .ribbon {
  position: absolute; top: 16px; right: 18px;
  background: rgba(245,74,69,0.10);
  color: #C62828;
  font-size: 11px; font-weight: 600;
  padding: 3px 8px; border-radius: 6px;
  font-family: var(--lark-font-latin);
  letter-spacing: 0.04em;
}
.lc-head {
  display: flex; align-items: flex-start; gap: 12px;
}
.country-flag {
  width: 32px; height: 32px; border-radius: 6px;
  background: var(--lark-surface-3);
  color: var(--lark-ink-2);
  font-family: var(--lark-font-latin);
  font-weight: 700; font-size: 12px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  letter-spacing: 0.02em;
}
.country-flag.US { background: #EFF6FF; color: #1E40AF; }
.country-flag.UK { background: #FEF2F2; color: #991B1B; }
.country-flag.DE { background: #FEFCE8; color: #854D0E; }
.country-flag.AU { background: #FFFBEB; color: #92400E; }
.country-flag.CA { background: #FEF2F2; color: #B91C1C; }
.country-flag.FR { background: #EEF2FF; color: #3730A3; }
.country-flag.JP { background: #FDF2F8; color: #BE185D; }
.country-flag.SA { background: #ECFDF5; color: #065F46; }
.country-flag.DK { background: #FEF2F2; color: #991B1B; }
.country-flag.SG { background: #FEE2E2; color: #B91C1C; }
.country-flag.MX { background: #ECFDF5; color: #166534; }
.country-flag.BR { background: #FEFCE8; color: #166534; }
.country-flag.EG { background: #F5F3FF; color: #6B21A8; }
.country-flag.PL { background: #FEF2F2; color: #991B1B; }
.country-flag.ID { background: #FEF2F2; color: #991B1B; }
.lc-org { font-size: 17px; font-weight: 600; color: var(--lark-ink); line-height: 1.3; }
.lc-meta { font-size: 12px; color: var(--lark-ink-3); margin-top: 2px; }
.lc-title { font-size: 15px; color: var(--lark-ink); font-weight: 500; line-height: 1.45; }

.lc-tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag {
  display: inline-flex; align-items: center;
  font-size: 12px; font-weight: 500;
  padding: 3px 9px; border-radius: 999px;
  background: var(--lark-surface-3); color: var(--lark-ink-2);
}
.tag.blue   { background: rgba(60,127,255,0.10);  color: var(--lark-blue-500); }
.tag.teal   { background: rgba(51,214,192,0.16);  color: #0D8772; }
.tag.purple { background: rgba(92,63,251,0.10);   color: #4B2BD9; }
.tag.orange { background: rgba(254,127,0,0.12);   color: #B45309; }

.lc-stats {
  display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
  border-top: 1px solid var(--lark-line);
  padding-top: 10px;
}
.lc-stat .label { font-size: 11px; color: var(--lark-ink-3); letter-spacing: 0.06em;
                   text-transform: uppercase; font-weight: 600; }
.lc-stat .value { font-size: 15px; color: var(--lark-ink); font-weight: 600; margin-top: 2px; }

.lc-foot {
  display: flex; align-items: center; justify-content: space-between;
  gap: 8px;
}
.owner-chip {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: 12px; color: var(--lark-ink-2);
}
.owner-chip .av {
  width: 22px; height: 22px; border-radius: 999px;
  color: #fff; font-size: 11px; font-weight: 600;
  display: flex; align-items: center; justify-content: center;
}
.confidence {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 11px; color: var(--lark-ink-3); letter-spacing: 0.04em;
}
.confidence b { color: var(--lark-ink); font-family: var(--lark-font-latin); font-weight: 600; }
.confidence-bar {
  width: 56px; height: 4px; border-radius: 999px; background: var(--lark-surface-3);
  overflow: hidden;
}
.confidence-bar i { display: block; height: 100%; background: var(--lark-teal); }

.fit { display: inline-flex; gap: 1px; color: #FFC107; font-size: 13px; }
.fit i { font-style: normal; }
.fit .empty { color: var(--lark-ink-4); }

.table {
  background: #fff; border: 1px solid var(--lark-line); border-radius: 10px;
  overflow: hidden;
}
.table-row {
  display: grid;
  grid-template-columns: 32px 1.5fr 0.7fr 0.9fr 0.9fr 0.6fr 40px;
  align-items: center;
  padding: 12px 18px;
  gap: 14px;
  font-size: 14px;
  border-bottom: 1px solid var(--lark-line);
  transition: 0.12s;
}
.table-row:last-child { border-bottom: none; }
.table-row.head {
  background: var(--lark-surface-2);
  font-size: 11px; font-weight: 600; color: var(--lark-ink-3);
  letter-spacing: 0.08em; text-transform: uppercase;
}
.table-row:not(.head):hover { background: var(--lark-surface-2); cursor: pointer; }
.table-row .t-org { font-weight: 600; color: var(--lark-ink); }
.table-row .t-org-sub { font-size: 12px; color: var(--lark-ink-3); font-weight: 400; margin-top: 1px; }
.table-row .t-num {
  font-family: var(--lark-font-latin);
  width: 22px; height: 22px; border-radius: 999px;
  background: var(--lark-surface-3); color: var(--lark-ink-3);
  font-size: 11px; font-weight: 600;
  display: flex; align-items: center; justify-content: center;
}
.table-row .t-action {
  width: 28px; height: 28px; border-radius: 6px;
  color: var(--lark-ink-3); font-size: 16px;
  display: flex; align-items: center; justify-content: center;
}
.table-row:not(.head):hover .t-action { background: var(--lark-surface-3); color: var(--lark-blue-500); }

.panel {
  background: #fff;
  border: 1px solid var(--lark-line);
  border-radius: 10px;
  padding: 18px 18px 16px;
}
.panel h3 {
  margin: 0 0 14px; font-size: 14px; font-weight: 600; color: var(--lark-ink);
  display: flex; align-items: center; justify-content: space-between;
}
.panel h3 .pill {
  font-size: 11px; font-weight: 600; color: var(--lark-blue-500);
  background: rgba(60,127,255,0.10); padding: 2px 8px; border-radius: 999px;
}

.funnel-row {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 10px;
}
.funnel-row:last-child { margin-bottom: 0; }
.funnel-row .bar-wrap { flex: 1; height: 24px; background: var(--lark-surface-2); border-radius: 6px; overflow: hidden; position: relative; }
.funnel-row .bar { height: 100%;
  background: linear-gradient(90deg, #33D6C0 0%, #3C7FFF 100%);
  border-radius: 6px;
  display: flex; align-items: center; padding: 0 10px;
  color: #fff; font-size: 12px; font-weight: 600;
  font-family: var(--lark-font-latin);
}
.funnel-row .label { font-size: 12px; color: var(--lark-ink-2); width: 88px; flex-shrink: 0; }
.funnel-row .count { width: 36px; text-align: right;
  font-family: var(--lark-font-latin); font-size: 13px; font-weight: 600; color: var(--lark-ink);
}

.source-row { display: flex; align-items: center; gap: 10px; margin-bottom: 9px; font-size: 13px; }
.source-row:last-child { margin-bottom: 0; }
.source-row .sw { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
.source-row .lbl { flex: 1; color: var(--lark-ink-2); }
.source-row .pct { font-family: var(--lark-font-latin); font-weight: 600; color: var(--lark-ink); font-size: 12px; }

function TrendSvg({data}) {
  const w = 280, h = 56, pad = 4;
  const max = Math.max(...data) * 1.2;
  const step = (w - pad*2) / (data.length - 1);
  const pts = data.map((v,i)=> [pad + i*step, h - pad - (v/max)*(h - pad*2)]);
  const path = pts.map((p,i)=> (i===0?'M':'L') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
  const area = path + ` L ${w-pad},${h-pad} L ${pad},${h-pad} Z`;
  return (
    <svg className="trend-svg" viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="none">
      <defs>
        <linearGradient id="tg" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor="#3C7FFF" stopOpacity="0.32"/>
          <stop offset="100%" stopColor="#3C7FFF" stopOpacity="0"/>
        </linearGradient>
      </defs>
      <path d={area} fill="url(#tg)"/>
      <path d={path} fill="none" stroke="#3C7FFF" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
      {pts.map((p,i)=> i===pts.length-1 ? (
        <g key={i}>
          <circle cx={p[0]} cy={p[1]} r="4" fill="#fff" stroke="#3C7FFF" strokeWidth="2"/>
        </g>
      ) : null)}
    </svg>
  );
}

function fitStage() {
  const canvas = document.querySelector('.stage-canvas');
  if (!canvas) return;
  const sx = window.innerWidth / 1440;
  const sy = window.innerHeight / 900;
  const s = Math.min(sx, sy, 1.4);
  canvas.style.transform = `scale(${s})`;
}
window.addEventListener('resize', fitStage);
setTimeout(fitStage, 0);
setTimeout(fitStage, 100);
</script>
