<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>青啤 AI 分身 · 小青 — 督办全景图</title>
  <style>
/* ============================================================
   Lark PPT — Foundations: Colors & Type
   Source: 飞书母版2025-打单 (LarkPPTTemplate.thmx)
   Theme:  飞书PPT 主题色  ·  Font scheme: 飞书品牌字
   ============================================================ */

/* ---- Webfonts -------------------------------------------------
   Original: 方正兰亭黑Pro_GB18030 (FangZheng LanTing Hei Pro)
   This is a licensed commercial CJK family. We substitute Noto
   Sans SC, the closest open-source geometric grotesque CJK
   sans available on Google Fonts. FLAG to user: replace with
   licensed FZLanTingHeiPro-* files for production parity.
---------------------------------------------------------------- */
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;900&family=Inter:wght@300;400;500;600;700;800&display=swap');

:root {

  /* ============================================================
     COLOR PRIMITIVES — drawn directly from theme1.xml clrScheme
     ============================================================ */

  /* Background / surface — slides ship dark by default
     (master clrMap swaps bg1="dk1", so dk1 is the page color) */
  --lark-bg-black:    #000000;   /* dk1  · primary slide bg */
  --lark-bg-deep:     #04060F;   /* near-black, used for hero gradients */
  --lark-bg-navy:     #0A1230;   /* deep navy, hero gradient origin */
  --lark-bg-twilight: #1B1F3A;   /* secondary panel */

  /* Foreground (on dark) */
  --lark-fg-white:    #FFFFFF;   /* lt1 · primary text on dark */
  --lark-fg-muted:    #E7E6E6;   /* lt2 · low-emphasis text on dark */
  --lark-fg-soft:     rgba(255,255,255,0.72);
  --lark-fg-quiet:    rgba(255,255,255,0.48);
  --lark-fg-faint:    rgba(255,255,255,0.16);

  /* Foreground (on light, for product UI surfaces) */
  --lark-ink:         #1F2329;   /* primary text on light surfaces */
  --lark-ink-2:       #51565D;
  --lark-ink-3:       #8F959E;
  --lark-ink-4:       #BBBFC4;
  --lark-line:        #DEE0E3;   /* divider on light */
  --lark-surface:     #FFFFFF;
  --lark-surface-2:   #F5F6F7;   /* page bg in product */
  --lark-surface-3:   #EFF0F1;

  /* Neutral — dk2/lt2 in theme */
  --lark-neutral-700: #767171;   /* dk2 */
  --lark-neutral-200: #E7E6E6;   /* lt2 */

  /* ---------- Brand accent palette (the 6 swatches) ---------- */
  --lark-blue:    #3C7FFF;       /* accent1 · primary brand blue */
  --lark-cyan:    #24C3FF;       /* accent2 */
  --lark-purple:  #5C3FFB;       /* accent3 · deep purple */
  --lark-teal:    #33D6C0;       /* accent4 · Lark logo teal */
  --lark-violet:  #9F6FF1;       /* accent5 */
  --lark-orange:  #FE7F00;       /* accent6 */

  /* Tints / shades for the brand blue (most-used accent) */
  --lark-blue-50:  #EAF1FF;
  --lark-blue-100: #C9DCFF;
  --lark-blue-200: #9DBEFF;
  --lark-blue-300: #6A9DFF;
  --lark-blue-400: #3C7FFF;      /* base · accent1 */
  --lark-blue-500: #2566EC;
  --lark-blue-600: #0057F9;      /* folHlink */
  --lark-blue-700: #003FB8;

  /* Semantic */
  --lark-link:           #3C7FFF;  /* hlink */
  --lark-link-visited:   #0057F9;  /* folHlink */
  --lark-success:        #33D6C0;
  --lark-warning:        #FE7F00;
  --lark-danger:         #F54A45;  /* commonly used in Lark product UI */
  --lark-info:           #24C3FF;

  /* ---------- Brand-defining gradients ---------- */
  /* Hero/cover gradient: navy fades to black with a faint blue
     glow top-left (matches image1.jpg / image4.jpg / image5.jpg) */
  --lark-grad-hero:
    radial-gradient(120% 100% at 0% 0%, #0F1A4A 0%, #060B22 38%, #000 78%);

  /* Section gradient: deeper, used for chapter pages */
  --lark-grad-section:
    radial-gradient(140% 110% at 100% 0%, #1A2256 0%, #050817 50%, #000 100%);

  /* Brand gradient (logo-derived: teal → cobalt → deep navy) */
  --lark-grad-brand:
    linear-gradient(135deg, #33D6C0 0%, #3C7FFF 50%, #1A1F6B 100%);

  /* Accent strip gradient (used for thin keylines / dividers) */
  --lark-grad-keyline:
    linear-gradient(90deg, #33D6C0 0%, #3C7FFF 50%, #5C3FFB 100%);

  /* ============================================================
     TYPE — drawn from theme1.xml fontScheme + slideMaster txStyles
     ============================================================ */

  /* Display / sans CJK — primary brand face */
  --lark-font-sans:
    "Noto Sans SC", "FZLanTingHeiPro_GB18030",
    "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB",
    "Helvetica Neue", Arial, sans-serif;

  /* Latin counterpart (numerals, English copy) */
  --lark-font-latin:
    "Inter", "Helvetica Neue", Arial,
    "Noto Sans SC", sans-serif;

  /* Mono (supporting — not in original theme, sensible default) */
  --lark-font-mono:
    "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;

  /* ---- Weights ---- */
  --lark-w-light:    300;
  --lark-w-regular:  400;
  --lark-w-medium:   500;   /* FZLanTingHei Medium — body copy default */
  --lark-w-semibold: 600;   /* FZLanTingHei SemiBold — H1/H2/title */
  --lark-w-bold:     700;   /* FZLanTingHei Bold — cover & big numbers */
  --lark-w-black:    900;

  /* ---- Type scale (slide-friendly @ 1920×1080)
     Names match the slide-master txStyles roles. Sizes scale
     linearly to product UI when used inside a `.product` scope. ---- */
  --lark-text-cover:    96px;   /* 50pt @ 1280 → ≈96px @ 1920 */
  --lark-text-section:  84px;   /* 一级章节页 — chapter headers */
  --lark-text-h1:       56px;   /* 30pt centered title */
  --lark-text-h2:       40px;   /* 26pt content-page title */
  --lark-text-h3:       32px;
  --lark-text-quote:    52px;   /* 金句页 (key-quote slide) */
  --lark-text-subtitle: 28px;   /* eyebrow / secondary line */
  --lark-text-body:     24px;   /* slide body — never below 24 */
  --lark-text-caption:  18px;
  --lark-text-eyebrow:  16px;   /* uppercase metadata */

  /* Line-height */
  --lark-lh-tight:   1.10;
  --lark-lh-snug:    1.25;
  --lark-lh-normal:  1.40;
  --lark-lh-loose:   1.65;

  /* Letter-spacing (CJK is ~0; latin caps slightly tracked) */
  --lark-tracking-tight:  -0.01em;
  --lark-tracking-normal: 0;
  --lark-tracking-wide:    0.04em;
  --lark-tracking-eyebrow: 0.14em;

  /* ============================================================
     SPACING / RADII / SHADOWS / MOTION
     ============================================================ */

  --lark-space-1: 4px;
  --lark-space-2: 8px;
  --lark-space-3: 12px;
  --lark-space-4: 16px;
  --lark-space-5: 24px;
  --lark-space-6: 32px;
  --lark-space-7: 48px;
  --lark-space-8: 64px;
  --lark-space-9: 96px;
  --lark-space-10: 128px;

  --lark-radius-xs: 4px;
  --lark-radius-sm: 6px;       /* Lark product buttons */
  --lark-radius-md: 8px;       /* cards, inputs */
  --lark-radius-lg: 12px;
  --lark-radius-xl: 16px;
  --lark-radius-2xl: 24px;
  --lark-radius-pill: 999px;

  /* Shadows — Lark product cards use soft, low elevations */
  --lark-shadow-1: 0 1px 2px rgba(31, 35, 41, 0.06), 0 0 1px rgba(31, 35, 41, 0.10);
  --lark-shadow-2: 0 4px 12px rgba(31, 35, 41, 0.08), 0 0 1px rgba(31, 35, 41, 0.10);
  --lark-shadow-3: 0 8px 32px rgba(31, 35, 41, 0.12);
  --lark-shadow-glow-blue: 0 0 32px rgba(60, 127, 255, 0.32);
  --lark-shadow-glow-teal: 0 0 32px rgba(51, 214, 192, 0.28);

  /* Borders */
  --lark-border-thin:   1px solid rgba(255,255,255,0.10);
  --lark-border-strong: 1px solid rgba(255,255,255,0.20);
  --lark-border-light:  1px solid var(--lark-line);

  /* Motion */
  --lark-ease:          cubic-bezier(0.4, 0, 0.2, 1);
  --lark-ease-out:      cubic-bezier(0.0, 0, 0.2, 1);
  --lark-ease-spring:   cubic-bezier(0.34, 1.56, 0.64, 1);
  --lark-dur-fast:      120ms;
  --lark-dur-base:      200ms;
  --lark-dur-slow:      400ms;
}

/* ============================================================
   SEMANTIC ROLES — apply directly to elements
   ============================================================ */

.lark-deck-bg {
  background: var(--lark-grad-hero);
  color: var(--lark-fg-white);
  font-family: var(--lark-font-sans);
}

/* Cover slide title */
.lark-cover-title {
  font-family: var(--lark-font-sans);
  font-weight: var(--lark-w-bold);
  font-size: var(--lark-text-cover);
  line-height: var(--lark-lh-tight);
  letter-spacing: var(--lark-tracking-tight);
  color: var(--lark-fg-white);
}

/* Section / chapter header */
.lark-section-title {
  font-family: var(--lark-font-sans);
  font-weight: var(--lark-w-bold);
  font-size: var(--lark-text-section);
  line-height: var(--lark-lh-tight);
  color: var(--lark-fg-white);
}

/* Content-page title (slide H2) */
.lark-h1 {
  font-family: var(--lark-font-sans);
  font-weight: var(--lark-w-semibold);
  font-size: var(--lark-text-h1);
  line-height: var(--lark-lh-snug);
  color: var(--lark-fg-white);
}
.lark-h2 {
  font-family: var(--lark-font-sans);
  font-weight: var(--lark-w-semibold);
  font-size: var(--lark-text-h2);
  line-height: var(--lark-lh-snug);
  color: var(--lark-fg-white);
}
.lark-h3 {
  font-family: var(--lark-font-sans);
  font-weight: var(--lark-w-semibold);
  font-size: var(--lark-text-h3);
  line-height: var(--lark-lh-snug);
  color: var(--lark-fg-white);
}

.lark-quote {
  font-family: var(--lark-font-sans);
  font-weight: var(--lark-w-semibold);
  font-size: var(--lark-text-quote);
  line-height: var(--lark-lh-snug);
  color: var(--lark-fg-white);
}

.lark-subtitle {
  font-family: var(--lark-font-sans);
  font-weight: var(--lark-w-medium);
  font-size: var(--lark-text-subtitle);
  line-height: var(--lark-lh-normal);
  color: var(--lark-fg-soft);
}

.lark-body {
  font-family: var(--lark-font-sans);
  font-weight: var(--lark-w-medium);
  font-size: var(--lark-text-body);
  line-height: var(--lark-lh-normal);
  color: var(--lark-fg-soft);
}

.lark-caption {
  font-family: var(--lark-font-sans);
  font-weight: var(--lark-w-regular);
  font-size: var(--lark-text-caption);
  line-height: var(--lark-lh-normal);
  color: var(--lark-fg-quiet);
}

.lark-eyebrow {
  font-family: var(--lark-font-latin);
  font-weight: var(--lark-w-semibold);
  font-size: var(--lark-text-eyebrow);
  letter-spacing: var(--lark-tracking-eyebrow);
  text-transform: uppercase;
  color: var(--lark-blue);
}

/* ============================================================
   PRODUCT-UI scope — Lark Suite app (light surface)
   Use by adding class `lark-product` on a container.
   ============================================================ */
.lark-product {
  background: var(--lark-surface-2);
  color: var(--lark-ink);
  font-family: var(--lark-font-sans);
  font-size: 14px;
  line-height: var(--lark-lh-normal);
}
.lark-product h1 { font-size: 28px; font-weight: var(--lark-w-semibold); color: var(--lark-ink); }
.lark-product h2 { font-size: 20px; font-weight: var(--lark-w-semibold); color: var(--lark-ink); }
.lark-product h3 { font-size: 16px; font-weight: var(--lark-w-semibold); color: var(--lark-ink); }
.lark-product p  { font-size: 14px; color: var(--lark-ink); }
.lark-product a  { color: var(--lark-link); text-decoration: none; }
.lark-product a:hover { text-decoration: underline; }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
    body { font-family: var(--lark-font-sans); }
    #root { min-height: 100vh; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

  <script type="text/babel">

// iOS.jsx — Simplified iOS 26 (Liquid Glass) device frame
// Based on the iOS 26 UI Kit + Figma status bar spec. No assets, no deps.
// Exports: IOSDevice, IOSStatusBar, IOSNavBar, IOSGlassPill, IOSList, IOSListRow, IOSKeyboard

// ─────────────────────────────────────────────────────────────
// Status bar
// ─────────────────────────────────────────────────────────────
function IOSStatusBar({ dark = false, time = '9:41' }) {
  const c = dark ? '#fff' : '#000';
  return (
    <div style={{
      display: 'flex', gap: 154, alignItems: 'center', justifyContent: 'center',
      padding: '21px 24px 19px', boxSizing: 'border-box',
      position: 'relative', zIndex: 20, width: '100%',
    }}>
      <div style={{ flex: 1, height: 22, display: 'flex', alignItems: 'center', justifyContent: 'center', paddingTop: 1.5 }}>
        <span style={{
          fontFamily: '-apple-system, "SF Pro", system-ui', fontWeight: 590,
          fontSize: 17, lineHeight: '22px', color: c,
        }}>{time}</span>
      </div>
      <div style={{ flex: 1, height: 22, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 7, paddingTop: 1, paddingRight: 1 }}>
        <svg width="19" height="12" viewBox="0 0 19 12">
          <rect x="0" y="7.5" width="3.2" height="4.5" rx="0.7" fill={c}/>
          <rect x="4.8" y="5" width="3.2" height="7" rx="0.7" fill={c}/>
          <rect x="9.6" y="2.5" width="3.2" height="9.5" rx="0.7" fill={c}/>
          <rect x="14.4" y="0" width="3.2" height="12" rx="0.7" fill={c}/>
        </svg>
        <svg width="17" height="12" viewBox="0 0 17 12">
          <path d="M8.5 3.2C10.8 3.2 12.9 4.1 14.4 5.6L15.5 4.5C13.7 2.7 11.2 1.5 8.5 1.5C5.8 1.5 3.3 2.7 1.5 4.5L2.6 5.6C4.1 4.1 6.2 3.2 8.5 3.2Z" fill={c}/>
          <path d="M8.5 6.8C9.9 6.8 11.1 7.3 12 8.2L13.1 7.1C11.8 5.9 10.2 5.1 8.5 5.1C6.8 5.1 5.2 5.9 3.9 7.1L5 8.2C5.9 7.3 7.1 6.8 8.5 6.8Z" fill={c}/>
          <circle cx="8.5" cy="10.5" r="1.5" fill={c}/>
        </svg>
        <svg width="27" height="13" viewBox="0 0 27 13">
          <rect x="0.5" y="0.5" width="23" height="12" rx="3.5" stroke={c} strokeOpacity="0.35" fill="none"/>
          <rect x="2" y="2" width="20" height="9" rx="2" fill={c}/>
          <path d="M25 4.5V8.5C25.8 8.2 26.5 7.2 26.5 6.5C26.5 5.8 25.8 4.8 25 4.5Z" fill={c} fillOpacity="0.4"/>
        </svg>
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Liquid glass pill — blur + tint + shine
// ─────────────────────────────────────────────────────────────
function IOSGlassPill({ children, dark = false, style = {} }) {
  return (
    <div style={{
      height: 44, minWidth: 44, borderRadius: 9999,
      position: 'relative', overflow: 'hidden',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      boxShadow: dark
        ? '0 2px 6px rgba(0,0,0,0.35), 0 6px 16px rgba(0,0,0,0.2)'
        : '0 1px 3px rgba(0,0,0,0.07), 0 3px 10px rgba(0,0,0,0.06)',
      ...style,
    }}>
      {/* blur + tint */}
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 9999,
        backdropFilter: 'blur(12px) saturate(180%)',
        WebkitBackdropFilter: 'blur(12px) saturate(180%)',
        background: dark ? 'rgba(120,120,128,0.28)' : 'rgba(255,255,255,0.5)',
      }} />
      {/* shine */}
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 9999,
        boxShadow: dark
          ? 'inset 1.5px 1.5px 1px rgba(255,255,255,0.15), inset -1px -1px 1px rgba(255,255,255,0.08)'
          : 'inset 1.5px 1.5px 1px rgba(255,255,255,0.7), inset -1px -1px 1px rgba(255,255,255,0.4)',
        border: dark ? '0.5px solid rgba(255,255,255,0.15)' : '0.5px solid rgba(0,0,0,0.06)',
      }} />
      <div style={{ position: 'relative', zIndex: 1, display: 'flex', alignItems: 'center', padding: '0 4px' }}>
        {children}
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Navigation bar — glass pills + large title
// ─────────────────────────────────────────────────────────────
function IOSNavBar({ title = 'Title', dark = false, trailingIcon = true }) {
  const muted = dark ? 'rgba(255,255,255,0.6)' : '#404040';
  const text = dark ? '#fff' : '#000';
  const pillIcon = (content) => (
    <IOSGlassPill dark={dark}>
      <div style={{ width: 36, height: 36, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
        {content}
      </div>
    </IOSGlassPill>
  );
  return (
    <div style={{
      display: 'flex', flexDirection: 'column', gap: 10,
      paddingTop: 62, paddingBottom: 10, position: 'relative', zIndex: 5,
    }}>
      <div style={{
        display: 'flex', alignItems: 'center', justifyContent: 'space-between',
        padding: '0 16px',
      }}>
        {/* back chevron */}
        {pillIcon(
          <svg width="12" height="20" viewBox="0 0 12 20" fill="none" style={{ marginLeft: -1 }}>
            <path d="M10 2L2 10l8 8" stroke={muted} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/>
          </svg>
        )}
        {/* trailing ellipsis */}
        {trailingIcon && pillIcon(
          <svg width="22" height="6" viewBox="0 0 22 6">
            <circle cx="3" cy="3" r="2.5" fill={muted}/>
            <circle cx="11" cy="3" r="2.5" fill={muted}/>
            <circle cx="19" cy="3" r="2.5" fill={muted}/>
          </svg>
        )}
      </div>
      {/* large title */}
      <div style={{
        padding: '0 16px',
        fontFamily: '-apple-system, system-ui',
        fontSize: 34, fontWeight: 700, lineHeight: '41px',
        color: text, letterSpacing: 0.4,
      }}>{title}</div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Grouped list (inset card, r:26) + row (52px)
// ─────────────────────────────────────────────────────────────
function IOSListRow({ title, detail, icon, chevron = true, isLast = false, dark = false }) {
  const text = dark ? '#fff' : '#000';
  const sec = dark ? 'rgba(235,235,245,0.6)' : 'rgba(60,60,67,0.6)';
  const ter = dark ? 'rgba(235,235,245,0.3)' : 'rgba(60,60,67,0.3)';
  const sep = dark ? 'rgba(84,84,88,0.65)' : 'rgba(60,60,67,0.12)';
  return (
    <div style={{
      display: 'flex', alignItems: 'center', minHeight: 52,
      padding: '0 16px', position: 'relative',
      fontFamily: '-apple-system, system-ui', fontSize: 17,
      letterSpacing: -0.43,
    }}>
      {icon && (
        <div style={{
          width: 30, height: 30, borderRadius: 7, background: icon,
          marginRight: 12, flexShrink: 0,
        }} />
      )}
      <div style={{ flex: 1, color: text }}>{title}</div>
      {detail && <span style={{ color: sec, marginRight: 6 }}>{detail}</span>}
      {chevron && (
        <svg width="8" height="14" viewBox="0 0 8 14" style={{ flexShrink: 0 }}>
          <path d="M1 1l6 6-6 6" stroke={ter} strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round"/>
        </svg>
      )}
      {!isLast && (
        <div style={{
          position: 'absolute', bottom: 0, right: 0,
          left: icon ? 58 : 16, height: 0.5, background: sep,
        }} />
      )}
    </div>
  );
}

function IOSList({ header, children, dark = false }) {
  const hc = dark ? 'rgba(235,235,245,0.6)' : 'rgba(60,60,67,0.6)';
  const bg = dark ? '#1C1C1E' : '#fff';
  return (
    <div>
      {header && (
        <div style={{
          fontFamily: '-apple-system, system-ui', fontSize: 13,
          color: hc, textTransform: 'uppercase',
          padding: '8px 36px 6px', letterSpacing: -0.08,
        }}>{header}</div>
      )}
      <div style={{
        background: bg, borderRadius: 26,
        margin: '0 16px', overflow: 'hidden',
      }}>{children}</div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Device frame
// ─────────────────────────────────────────────────────────────
function IOSDevice({
  children, width = 402, height = 874, dark = false,
  title, keyboard = false,
}) {
  return (
    <div style={{
      width, height, borderRadius: 48, overflow: 'hidden',
      position: 'relative', background: dark ? '#000' : '#F2F2F7',
      boxShadow: '0 40px 80px rgba(0,0,0,0.18), 0 0 0 1px rgba(0,0,0,0.12)',
      fontFamily: '-apple-system, system-ui, sans-serif',
      WebkitFontSmoothing: 'antialiased',
    }}>

// Shared anim helpers (inline; this file is standalone)

const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const easeOut = (t) => 1 - Math.pow(1 - t, 3);
const easeOutQuint = (t) => 1 - Math.pow(1 - t, 5);

function inAt(t, start, dur = 500, easing = easeOut) {
  return easing(clamp((t - start) / dur));
}

const TCtx = createContext(0);
const useT = () => useContext(TCtx);

function In({ start = 0, dur = 500, dy = 10, dx = 0, children, style = {}, easing = easeOut }) {
  const t = useT();
  const p = inAt(t, start, dur, easing);
  return (
    <div
      style={{
        opacity: p,
        transform: `translate(${(1 - p) * dx}px, ${(1 - p) * dy}px)`,
        willChange: 'transform, opacity',
        ...style,
      }}
    >
      {children}
    </div>
  );
}

function CountUp({ to, start, dur = 800, decimals = 0 }) {
  const t = useT();
  const p = inAt(t, start, dur, easeOut);
  return <>{(to * p).toFixed(decimals)}</>;
}

// ───────────────────────────────────────────────
function App() {
  const PREVIEW_TICK = T.hero + 1200; // hero stats fully shown, scroll at top
  const STOP_AT = T.hold;             // play once then freeze

  const [phase, setPhase] = useState('preview');
  const [tick, setTick] = useState(T.hero + 1200);
  const startRef = useRef(null);

  useEffect(() => {
    if (phase !== 'playing') return;
    startRef.current = performance.now();
    let raf;
    const loop = () => {
      const elapsed = performance.now() - startRef.current;
      if (elapsed >= STOP_AT) { setTick(STOP_AT); return; }
      setTick(elapsed);
      raf = requestAnimationFrame(loop);
    };
    raf = requestAnimationFrame(loop);
    return () => cancelAnimationFrame(raf);
  }, [phase]);

  const [scale, setScale] = useState(1);
  useEffect(() => {
    const update = () => {
      const dw = 393, dh = 852;
      const s = Math.min(window.innerWidth / dw, window.innerHeight / dh);
      setScale(s);
    };
    update();
    window.addEventListener('resize', update);
    return () => window.removeEventListener('resize', update);
  }, []);

  // Auto-scroll director
  const scrollRef = useRef(null);
  useEffect(() => {
    if (!scrollRef.current) return;
    let target = 0;
    if (tick > T.hero) target = 0;
    if (tick > T.hero + 1500) target = 60;
    if (tick > T.delayedHdr) target = 180;
    if (tick > T.delay1 + 1700) target = 300;
    if (tick > T.delay2) target = 480;
    if (tick > T.delay2 + 1700) target = 640;
    if (tick > T.delay3) target = 800;
    if (tick > T.delay3 + 1700) target = 970;
    if (tick > T.noAct) target = 1110;
    if (tick > T.noAct + 1200) target = 1280;
    if (tick > T.noAct + 2400) target = 1430;
    if (tick > T.contraSec) target = 1550;
    if (tick > T.contra + 800) target = 1690;
    if (tick > T.contra + 1800) target = 1820;
    if (tick > T.actSec) target = 1960;
    if (tick > T.actions + 800) target = 2050;
    if (tick > T.onTrackHdr) target = 2180;
    if (tick > T.onTrack + 800) target = 2320;
    if (tick > T.hold) target = 2400;
    const cur = scrollRef.current.scrollTop;
    scrollRef.current.scrollTop = cur + (target - cur) * 0.12;
  }, [tick]);

  return (
    <TCtx.Provider value={tick}>
      <link rel="stylesheet" href="lark-tokens.css" />
      <div onClick={() => phase === 'preview' && setPhase('playing')} style={{
        position: 'absolute', inset: 0,
        background: 'transparent',
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        fontFamily: 'var(--lark-font-sans)',
        overflow: 'hidden',
        cursor: phase === 'preview' ? 'pointer' : 'default',
      }}>
        {phase === 'preview' && (
          <div style={{
            position: 'absolute', bottom: 90, left: 0, right: 0, zIndex: 100,
            display: 'flex', justifyContent: 'center',
            pointerEvents: 'none',
          }}>
            <div style={{
              background: 'rgba(60,127,255,0.90)',
              borderRadius: 999, padding: '9px 24px',
              color: '#fff', fontSize: 13, fontWeight: 600,
              boxShadow: '0 4px 18px rgba(60,127,255,0.40)',
              display: 'flex', alignItems: 'center', gap: 8,
            }}>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="white"><path d="M5 3l14 9-14 9V3z"/></svg>
              点击播放
            </div>
          </div>
        )}

        <div style={{ transform: `scale(${scale})`, transformOrigin: 'center center' }}>
          <IOSDevice width={393} height={852}>
            <div style={{ height: '100%', display: 'flex', flexDirection: 'column', position: 'relative' }}>
              {/* Push notification (overlay on lock-screen/blank period) */}
              <PushNotif start={T.notif} leave={T.notifLeave} />

              <div ref={scrollRef} className="no-scrollbar" style={{
                flex: 1, overflowY: 'auto', overflowX: 'hidden',
                background: '#F5F6F7',
              }}>
                <Dashboard />
              </div>
            </div>
          </IOSDevice>
        </div>

        {/* Floating switch to the other demo */}
        <a href="index.html" style={{
          position: 'absolute', left: 24, bottom: 24,
          padding: '10px 16px',
          background: 'rgba(255,255,255,0.08)',
          border: '1px solid rgba(255,255,255,0.15)',
          borderRadius: 999, backdropFilter: 'blur(12px)',
          color: 'rgba(255,255,255,0.85)',
          fontSize: 13, textDecoration: 'none',
          fontFamily: 'var(--lark-font-sans)',
          display: 'flex', alignItems: 'center', gap: 6,
        }}>
          ← 批阅 demo
        </a>
      </div>

      <style>{`
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { scrollbar-width: none; }
      `}</style>
    </TCtx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

  </script>
</body>
</html>
