<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>经销商生意大脑 · 五张地图</title>
<style>
/* ============================================================
   经销商生意大脑 · Design Tokens
   ============================================================ */
:root {
  /* canvas */
  --canvas-w: 1920px;
  --canvas-h: 1080px;

  /* surface ramp (cool-dark) */
  --bg-0: oklch(0.155 0.012 245);
  --bg-1: oklch(0.195 0.014 245);
  --bg-2: oklch(0.235 0.016 245);
  --bg-3: oklch(0.275 0.018 245);
  --border-1: oklch(0.32 0.02 245);
  --border-2: oklch(0.40 0.022 245);

  /* text */
  --t-1: oklch(0.975 0.005 245);
  --t-2: oklch(0.78 0.012 245);
  --t-3: oklch(0.58 0.015 245);
  --t-4: oklch(0.44 0.018 245);

  /* accents */
  --amber: oklch(0.80 0.16 70);
  --amber-dim: oklch(0.55 0.12 70);
  --cyan: oklch(0.78 0.13 220);
  --cyan-dim: oklch(0.50 0.10 220);
  --green: oklch(0.78 0.15 150);
  --red: oklch(0.70 0.22 25);
  --red-dim: oklch(0.45 0.18 25);
  --purple: oklch(0.72 0.17 295);
  --pink: oklch(0.74 0.16 350);

  /* font */
  --f-sans: "Noto Sans SC", system-ui, sans-serif;
  --f-serif: "Noto Serif SC", "Source Han Serif", serif;
  --f-mono: "IBM Plex Mono", "JetBrains Mono", ui-monospace, monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: #000;
  color: var(--t-1);
  font-family: var(--f-sans);
  font-feature-settings: "tnum" 1, "ss01" 1;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ============================================================
   Stage – 1920×1080 letterboxed
   ============================================================ */
#stage-wrap {
  position: fixed; inset: 0;
  background: #000;
  overflow-y: auto;
  overflow-x: hidden;
}
.stage-sizer {
  margin: 0 auto;
  position: relative;
  background: var(--bg-0);
}
#stage {
  width: var(--canvas-w);
  background: var(--bg-0);
  position: relative;
  transform-origin: 0 0;
  /* subtle ambient gradient */
  background-image:
    radial-gradient(ellipse 1200px 700px at 20% -10%, oklch(0.30 0.05 250 / 0.45), transparent 60%),
    radial-gradient(ellipse 900px 600px at 110% 110%, oklch(0.30 0.06 30 / 0.30), transparent 55%);
}

/* ============================================================
   Top bar / nav
   ============================================================ */
.topbar {
  height: 120px;
  display: flex; align-items: center;
  padding: 0 56px;
  border-bottom: 1px solid var(--border-1);
  position: sticky;
  top: 0;
  z-index: 5;
  background: var(--bg-0);
}
.brand {
  display: flex; align-items: center; gap: 16px;
  margin-right: 56px;
}
.brand-mark {
  width: 56px; height: 56px;
  display: grid; place-items: center;
  border: 1px solid var(--amber);
  color: var(--amber);
  font-family: var(--f-mono);
  font-size: 26px; font-weight: 600;
}
.brand-title {
  font-family: var(--f-serif);
  font-weight: 600;
  font-size: 30px;
  letter-spacing: 0.04em;
  color: var(--t-1);
  white-space: nowrap;
}
.brand-sub {
  font-family: var(--f-mono);
  font-size: 14px; letter-spacing: 0.18em;
  color: var(--t-3);
  text-transform: uppercase;
  margin-top: 4px;
  white-space: nowrap;
}

.tabs {
  display: flex; gap: 4px;
  flex: 1;
}
.tab {
  padding: 18px 18px;
  background: transparent;
  border: 1px solid transparent;
  color: var(--t-3);
  font-family: var(--f-sans);
  font-size: 22px;
  font-weight: 500;
  cursor: pointer;
  display: flex; align-items: center; gap: 10px;
  transition: color .2s, background .2s, border-color .2s;
  position: relative;
  white-space: nowrap;
}
.tab:hover { color: var(--t-1); }
.tab.active {
  color: var(--t-1);
  background: var(--bg-2);
  border-color: var(--border-1);
}
.tab.active::before {
  content: "";
  position: absolute;
  left: 0; right: 0; top: -1px;
  height: 2px;
  background: var(--amber);
}
.tab-num {
  font-family: var(--f-mono);
  font-size: 16px;
  color: var(--t-4);
  letter-spacing: 0.08em;
}
.tab.active .tab-num { color: var(--amber); }

.topbar-meta {
  display: flex; align-items: center; gap: 28px;
  margin-left: auto;
  font-family: var(--f-mono);
  font-size: 17px;
  color: var(--t-3);
  white-space: nowrap;
}
.topbar-meta .dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--green);
  display: inline-block;
  margin-right: 8px;
  box-shadow: 0 0 0 4px oklch(0.78 0.15 150 / 0.18);
  animation: live 2s infinite;
}
@keyframes live {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

/* ============================================================
   Scene container
   ============================================================ */
.scene {
  position: relative;
  min-height: calc(1080px - 120px);
  padding: 28px 56px 56px;
  display: flex;
  flex-direction: column;
  gap: 22px;
}

/* helper: section header */
.section-head {
  display: flex; align-items: flex-end;
  justify-content: space-between;
  padding-bottom: 20px;
  margin-bottom: 0;
  border-bottom: 1px solid var(--border-1);
  gap: 32px;
}
.section-title {
  font-family: var(--f-serif);
  font-size: 56px;
  font-weight: 600;
  letter-spacing: 0.02em;
  color: var(--t-1);
  line-height: 1.05;
}
.section-eyebrow {
  font-family: var(--f-mono);
  font-size: 17px;
  letter-spacing: 0.2em;
  color: var(--amber);
  text-transform: uppercase;
  margin-bottom: 12px;
  white-space: nowrap;
}
.section-sub {
  font-size: 23px;
  color: var(--t-2);
  line-height: 1.5;
  max-width: 760px;
  text-align: right;
}

/* cards */
.card {
  background: var(--bg-1);
  border: 1px solid var(--border-1);
  padding: 24px;
  position: relative;
  min-height: 0;
}
.card-title {
  font-size: 20px;
  font-weight: 600;
  color: var(--t-2);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-bottom: 18px;
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px;
}
.card-title .badge {
  font-family: var(--f-mono);
  font-size: 15px;
  color: var(--t-3);
  letter-spacing: 0.1em;
  padding: 6px 12px;
  border: 1px solid var(--border-2);
  text-transform: none;
  white-space: nowrap;
}

/* metric */
.metric { display: flex; flex-direction: column; gap: 8px; }
.metric-val {
  font-family: var(--f-mono);
  font-size: 68px;
  font-weight: 500;
  color: var(--t-1);
  line-height: 1;
}
.metric-label {
  font-size: 20px;
  color: var(--t-3);
  letter-spacing: 0.04em;
}
.metric-delta {
  font-family: var(--f-mono);
  font-size: 18px;
  color: var(--green);
}
.metric-delta.down { color: var(--red); }

/* legend chip */
.chip {
  display: inline-flex; align-items: center; gap: 10px;
  font-size: 19px;
  color: var(--t-2);
  font-family: var(--f-mono);
}
.chip i {
  width: 16px; height: 16px;
  display: inline-block;
}

/* footer */
.scene-footer {
  margin-top: auto;
  padding-top: 18px;
  border-top: 1px solid var(--border-1);
  display: flex; align-items: center; justify-content: space-between;
  font-family: var(--f-mono);
  font-size: 15px;
  letter-spacing: 0.16em;
  color: var(--t-4);
  text-transform: uppercase;
}

/* particle layer (overview) */
.particle {
  position: absolute;
  width: 4px; height: 4px;
  border-radius: 50%;
  pointer-events: none;
}

/* network svg helpers */
.node-label {
  font-family: var(--f-mono);
  font-size: 16px;
  fill: var(--t-2);
}

.subtle-grid {
  background-image:
    linear-gradient(to right, oklch(0.30 0.02 245 / 0.20) 1px, transparent 1px),
    linear-gradient(to bottom, oklch(0.30 0.02 245 / 0.20) 1px, transparent 1px);
  background-size: 48px 48px;
}

/* button */
.btn {
  display: inline-flex; align-items: center; gap: 12px;
  padding: 18px 28px;
  background: transparent;
  border: 1px solid var(--border-2);
  color: var(--t-1);
  font-family: var(--f-sans);
  font-size: 20px;
  font-weight: 500;
  cursor: pointer;
  transition: background .2s, border-color .2s;
}
.btn:hover { background: var(--bg-2); border-color: var(--amber); }
.btn-primary {
  background: var(--amber);
  color: var(--bg-0);
  border-color: var(--amber);
  font-weight: 600;
}
.btn-primary:hover { background: oklch(0.85 0.17 70); }

/* utility */
.row { display: flex; }
.col { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.gap-8 { gap: 8px; } .gap-12 { gap: 12px; } .gap-16 { gap: 16px; } .gap-24 { gap: 24px; } .gap-32 { gap: 32px; }
.mono { font-family: var(--f-mono); }
.serif { font-family: var(--f-serif); }
.t1 { color: var(--t-1); } .t2 { color: var(--t-2); } .t3 { color: var(--t-3); } .t4 { color: var(--t-4); }
.amber { color: var(--amber); } .cyan { color: var(--cyan); } .red { color: var(--red); } .green { color: var(--green); } .purple { color: var(--purple); }

/* scrollbar tame */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: var(--border-2); }
::-webkit-scrollbar-track { background: transparent; }

/* fade in */
@keyframes fadein {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
.fade-in { animation: fadein .5s ease both; }

/* pulse */
@keyframes pulse-red {
  0%, 100% { box-shadow: 0 0 0 0 oklch(0.70 0.22 25 / 0.6); }
  50% { box-shadow: 0 0 0 10px oklch(0.70 0.22 25 / 0); }
}
.pulse-red { animation: pulse-red 1.6s infinite; }

/* tooltip */
.tt {
  position: absolute;
  background: var(--bg-2);
  border: 1px solid var(--border-2);
  padding: 16px 18px;
  font-size: 17px;
  pointer-events: none;
  z-index: 50;
  min-width: 260px;
}
.tt-title { font-weight: 600; color: var(--t-1); margin-bottom: 10px; font-size: 19px; }
.tt-row { display: flex; justify-content: space-between; gap: 16px; color: var(--t-2); font-family: var(--f-mono); font-size: 16px; padding: 3px 0; }
.tt-row b { color: var(--t-1); font-weight: 500; }

</style>
</head>
<body>
  <div id="stage-wrap">
    <div class="stage-sizer" id="stage-sizer">
      <div id="stage">
        <div id="root"></div>
      </div>
    </div>
  </div>
