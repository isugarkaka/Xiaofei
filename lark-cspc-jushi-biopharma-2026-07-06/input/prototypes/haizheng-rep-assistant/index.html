<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小海同学 · QA / QC助手</title>
<style>
  :root{
    --blue:#1456f0; --blue-hover:#336df4;
    --title:#1f2329; --caption:#646a73; --placeholder:#8f959e;
    --border-card:#dee0e3; --border-comp:#d0d3d6; --divider:#1f232926;
    --bg-body:#ffffff; --bg-base:#f2f3f5; --bg-content:#f9f9f9;
    --ai:#1456f0;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",-apple-system,sans-serif;
    background:var(--bg-base); color:var(--title);
    -webkit-font-smoothing:antialiased; display:flex; justify-content:center;
  }
  .phone{width:100%; max-width:475px; min-height:100vh; background:var(--bg-content);
    display:flex; flex-direction:column; position:relative}
  svg{width:1em; height:1em; display:block; fill:currentColor}

  /* status bar */
  .status{height:32px; display:flex; align-items:center; justify-content:space-between;
    padding:0 18px; font-size:17px; font-weight:600; color:var(--title); background:var(--bg-body)}
  .status .dots{display:flex; gap:5px; align-items:center; font-size:16px; color:var(--title)}

  /* nav bar */
  .nav{height:48px; display:flex; align-items:center; gap:8px; padding:0 12px;
    background:var(--bg-body); border-bottom:0.5px solid var(--divider)}
  .nav .ic{width:24px; height:24px; color:var(--title); font-size:21px; flex:none;
    display:flex; align-items:center; justify-content:center; cursor:pointer}
  .nav .who{flex:1; display:flex; align-items:center; gap:6px; justify-content:center; margin-right:24px}
  .nav .who .avatar{width:24px; height:24px; border-radius:6px; object-fit:cover;
    background:#1456f0; color:#fff; font-size:17px;
    display:flex; align-items:center; justify-content:center; font-weight:600}
  .nav .who b{font-size:20px; font-weight:600; color:var(--title)}
  .nav .who .tag{font-size:15px; color:var(--caption); background:var(--bg-base);
    border-radius:4px; padding:1px 6px}
  .nav .who .chev{font-size:15px; color:var(--placeholder)}

  /* visit storyline stepper */
  .tabs{display:flex; gap:8px; padding:12px 16px 4px; background:var(--bg-content)}
  .tab{flex:1; height:38px; border-radius:8px; border:0.5px solid var(--border-comp);
    background:var(--bg-body); color:var(--caption); font-size:18px; font-weight:500;
    display:flex; align-items:center; justify-content:center; gap:6px; cursor:pointer;
    transition:all .18s}
  .tab .n{width:18px; height:18px; border-radius:50%; background:var(--bg-base); color:var(--caption);
    font-size:15px; font-weight:700; display:flex; align-items:center; justify-content:center; flex:none}
  .tab.on{background:var(--blue); color:#fff; border-color:var(--blue)}
  .tab.on .n{background:#ffffff33; color:#fff}
  .tab:active:not(.on),.nav .ic:active,.inputbar .ic:active,.chip:active{background:#1f23290d}

  /* scene context strip — ties the 3 steps into one visit */
  .scene{display:flex; align-items:center; gap:6px; padding:6px 16px 0; background:var(--bg-content);
    font-size:16px; color:var(--caption)}
  .scene .pin{font-size:17px; flex:none}
  .scene b{color:var(--title); font-weight:600}

  /* chat */
  .chat{flex:1; overflow-y:auto; padding:12px 16px 8px; display:flex; flex-direction:column; gap:14px}
  .row{display:flex; gap:8px; max-width:100%}
  .row.me{justify-content:flex-end}
  .bubble.me{background:var(--blue); color:#fff; border-radius:12px 12px 4px 12px;
    padding:10px 14px; font-size:19px; line-height:1.5; max-width:80%}
  .ava{width:30px; height:30px; border-radius:8px; flex:none; object-fit:cover;
    background:#1456f0; color:#fff; font-size:19px;
    display:flex; align-items:center; justify-content:center; font-weight:600}
  .ans{max-width:84%; display:flex; flex-direction:column; gap:8px}
  .think{display:inline-flex; align-items:center; gap:6px; align-self:flex-start;
    background:var(--bg-base); border-radius:8px; padding:6px 10px;
    font-size:17px; color:var(--caption)}
  .think .sp{width:12px; height:12px; border:2px solid #c7ccd4; border-top-color:var(--blue);
    border-radius:50%; animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .think .chev{font-size:10px; color:var(--placeholder)}
  .card{background:var(--bg-body); border:0.5px solid var(--border-card); border-radius:12px;
    padding:14px 16px; font-size:18px; line-height:1.62; color:var(--title)}
  .card h4{font-size:19px; font-weight:600; margin-bottom:8px; color:var(--title)}
  .card .grade{display:flex; flex-direction:column; gap:7px; margin:4px 0 2px}
  .card .lvl{display:flex; gap:8px; align-items:baseline}
  .card .lvl .t{font-size:16px; font-weight:600; color:var(--blue); background:#1456f014;
    border-radius:4px; padding:1px 7px; flex:none; min-width:62px; text-align:center}
  .card .lvl .x{color:var(--caption); font-size:17px}
  .card .sec{margin-top:11px}
  .card .sec .lab{font-size:17px; font-weight:600; color:var(--title); margin-bottom:4px}
  .card .sec .li{color:var(--caption); font-size:17px; padding-left:12px; position:relative; margin-bottom:3px}
  .card .sec .li::before{content:""; position:absolute; left:2px; top:8px; width:4px; height:4px;
    border-radius:50%; background:var(--blue)}
  .card .sec .li b{color:var(--title); font-weight:600}
  .cite{display:inline-flex; align-items:center; gap:6px; align-self:flex-start;
    background:var(--bg-base); border-radius:8px; padding:7px 11px; font-size:16px;
    color:var(--caption); max-width:100%}
  .cite .ic{font-size:19px; color:var(--blue); flex:none}
  .cite b{color:var(--title); font-weight:500; white-space:nowrap; overflow:hidden;
    text-overflow:ellipsis}

  /* composer */
  .composer{background:var(--bg-body); border-top:0.5px solid var(--divider); padding:8px 12px 12px}
  .chips{display:flex; gap:8px; padding:2px 2px 9px; overflow-x:auto}
  .chip{flex:none; height:28px; border-radius:14px; border:0.5px solid var(--border-comp);
    background:var(--bg-body); color:var(--caption); font-size:16px; display:flex;
    align-items:center; gap:5px; padding:0 12px; cursor:pointer}
  .chip .ic{font-size:18px; color:var(--blue)}
  .inputbar{display:flex; align-items:center; gap:10px; height:44px;
    border:0.5px solid var(--border-comp); border-radius:22px; padding:0 8px 0 14px;
    background:var(--bg-body)}
  .inputbar .ph{flex:1; color:var(--placeholder); font-size:18px}
  .inputbar .ic{width:24px; height:24px; font-size:21px; color:var(--caption); flex:none;
    display:flex; align-items:center; justify-content:center; cursor:pointer}
  .inputbar .send{width:32px; height:32px; border-radius:50%; background:var(--blue); color:#fff;
    font-size:20px; display:flex; align-items:center; justify-content:center; flex:none; cursor:pointer}
  .tools{display:flex; align-items:center; gap:16px; padding:10px 4px 2px; color:var(--caption)}
  .tools .ic{font-size:22px; cursor:pointer}
  .reveal{animation:rise .42s cubic-bezier(.2,.7,.3,1) both}
  @keyframes rise{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none}}
</style>
</head>
<body>
<div class="phone">
  <div class="status"><span>9:41</span><span class="dots">·il &nbsp; 5G &nbsp; ▮</span></div>
  <div class="nav">
    <span class="ic" id="ic-back"></span>
    <div class="who"><img class="avatar" data-fs-src="../../../assets/shared/digital_employee_avatars_50/25_east_asian_woman_navy_blazer.png" alt="小海同学" loading="lazy" decoding="async"><b>小海同学</b><span class="tag">机器人</span><span class="chev">▸</span></div>
    <span class="ic" id="ic-more"></span>
  </div>

  <div class="tabs">
    <button class="tab on" data-flow="0"><span class="n">1</span>拜访前</button>
    <button class="tab" data-flow="1"><span class="n">2</span>递话术</button>
    <button class="tab" data-flow="2"><span class="n">3</span>接异议</button>
  </div>
  <div class="scene"><span class="pin">📍</span>与 <b>皮肤科 · 王主任</b> 的一次拜访 · 全程话术随身</div>

  <div class="chat" id="chat"></div>

  <div class="composer">
    <div class="chips">
      <span class="chip" id="chip-new"><span class="ic" id="ic-add2"></span>新话题</span>
      <span class="chip"><span class="ic" id="ic-doc2"></span>巨石质量/工艺知识库首页</span>
    </div>
    <div class="inputbar">
      <span class="ph">发送给 小海同学</span>
      <span class="ic" id="ic-emoji"></span>
      <span class="ic" id="ic-at"></span>
      <span class="ic" id="ic-voice"></span>
      <span class="ic" id="ic-image"></span>
      <span class="send" id="ic-send"></span>
    </div>
  </div>
</div>

<script>
// ---- inline UD catalog icons (normalized to currentColor) ----
const I = {
  back:'<svg viewBox="0 0 24 24"><path d="M16.293 2.293a1 1 0 0 1 0 1.414L8 12l8.293 8.293a1 1 0 0 1-1.414 1.414l-8.293-8.293a2 2 0 0 1 0-2.828l8.293-8.293a1 1 0 0 1 1.414 0Z"/></svg>',
  more:'<svg viewBox="0 0 24 24"><path d="M5.5 11.75a1.75 1.75 0 1 1-3.5 0 1.75 1.75 0 0 1 3.5 0Zm8.225 0a1.75 1.75 0 1 1-3.5 0 1.75 1.75 0 0 1 3.5 0Zm8.275 0a1.75 1.75 0 1 1-3.5 0 1.75 1.75 0 0 1 3.5 0Z"/></svg>',
  add:'<svg viewBox="0 0 24 24"><path d="M12 2a1 1 0 0 0-1 1v8H3a1 1 0 1 0 0 2h8v8a1 1 0 1 0 2 0v-8h8a1 1 0 1 0 0-2h-8V3a1 1 0 0 0-1-1Z"/></svg>',
  emoji:'<svg viewBox="0 0 24 24"><path d="M1 12c0 6.075 4.925 11 11 11s11-4.925 11-11S18.075 1 12 1 1 5.925 1 12Zm20 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-7-2.5a1 1 0 1 1 2 0v1a1 1 0 1 1-2 0v-1Zm-4 0a1 1 0 0 0-2 0v1a1 1 0 1 0 2 0v-1Zm5.455 4.5h1.12c.26 0 .44.268.323.502A5.5 5.5 0 0 1 12 17.5a5.5 5.5 0 0 1-4.893-2.986c-.123-.238.064-.514.332-.514h1.197c.31 0 .598.147.803.38.047.053.093.103.133.14.63.607 1.485.98 2.428.98.95 0 1.81-.378 2.441-.992.036-.034.077-.08.12-.128a1.08 1.08 0 0 1 .803-.38h.09Z"/></svg>',
  at:'<svg viewBox="0 0 24 24"><path d="M18.75 16a3.622 3.622 0 0 1-2.637-1.156A5 5 0 1 1 17 12c0 1.105.784 2 1.75 2 1.512 0 1.776-2 1.776-2 .08-.548.138-.903.138-1.568C20.664 6.997 17.164 3 12 3s-8.98 3.836-8.98 9 3.816 9.01 8.98 9.01c1.807 0 3.487-.634 4.916-1.544a.823.823 0 0 1 .853-.028l.041.024.903.519a.41.41 0 0 1 .067.682A10.953 10.953 0 0 1 12 23C5.925 23 1 18.075 1 12S5.925 1 12 1s10.657 4.265 10.657 9.432c0 .256.014.522-.136 1.794C22.296 14.326 20.75 16 18.75 16ZM12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/></svg>',
  voice:'<svg viewBox="0 0 24 24"><path d="M12 16a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z"/><path d="M12 23c6.075 0 11-4.925 11-11S18.075 1 12 1 1 5.925 1 12s4.925 11 11 11Zm0-2a9 9 0 1 1 0-18 9 9 0 0 1 0 18Z"/></svg>',
  image:'<svg viewBox="0 0 24 24"><path d="m10.141 17.988-4.275-.01a.3.3 0 0 1-.212-.512l4.133-4.133a.4.4 0 0 1 .566 0l1.907 1.907 5.057-5.057a.4.4 0 0 1 .683.283V17.7a.3.3 0 0 1-.3.3h-7.476a.301.301 0 0 1-.083-.012ZM4 22c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h16c1.1 0 2 .9 2 2v16c0 1.1-.9 2-2 2H4Zm0-2h16V4H4v16ZM6 6h3v3H6V6Z"/></svg>',
  send:'<svg viewBox="0 0 24 24"><path d="M21.707 16.293a1 1 0 0 1-1.414 0L12 8l-8.293 8.293a1 1 0 0 1-1.414-1.414l8.293-8.293a2 2 0 0 1 2.828 0l8.293 8.293a1 1 0 0 1 0 1.414Z"/></svg>',
  doc:'<svg viewBox="0 0 24 24"><path d="M7 12a1 1 0 0 1 1-1h8a1 1 0 1 1 0 2H8a1 1 0 0 1-1-1Zm1 4a1 1 0 1 0 0 2h4a1 1 0 1 0 0-2H8Z"/><path d="M3 2.993C3 1.888 3.895 1 5 1h9.257a2 2 0 0 1 1.414.586l4.743 4.744A2 2 0 0 1 21 7.744V21c0 1.105-.894 2-1.998 2H4.996A1.99 1.99 0 0 1 3 21.009V2.993ZM14 3H5v18h14V8.02c-.48 0-2.69-.01-4.005-.016a1 1 0 0 1-.995-1V3Z"/></svg>',
};
const put=(id,k)=>{const e=document.getElementById(id); if(e) e.innerHTML=I[k];};
put('ic-back','back'); put('ic-more','more'); put('ic-add2','add'); put('ic-doc2','doc');
put('ic-emoji','emoji'); put('ic-at','at'); put('ic-voice','voice'); put('ic-image','image'); put('ic-send','send');

// ---- one visit, three beats: 备课 → 递话术 → 接异议 ----
const FLOWS=[
{
  q:'等下见王主任，痤疮患者多 — 先把《中国痤疮治疗指南》的分级和一线方案给我过一遍',
  ans:`<div class="card">
    <h4>《中国痤疮治疗指南(2019 修订版)》· 核心内容</h4>
    <div class="sec"><div class="lab">痤疮分级</div>
      <div class="grade">
        <div class="lvl"><span class="t">轻度 I 级</span><span class="x">仅粉刺</span></div>
        <div class="lvl"><span class="t">中度 II–III</span><span class="x">炎性丘疹 · 脓疱</span></div>
        <div class="lvl"><span class="t">重度 IV 级</span><span class="x">结节 · 囊肿</span></div>
      </div>
    </div>
    <div class="sec"><div class="lab">推荐治疗方案</div>
      <div class="li"><b>轻度</b>：一线外用维 A 酸，可联合过氧化苯甲酰</div>
      <div class="li"><b>中度</b>：外用维 A 酸 + 过氧化苯甲酰 + 外用/口服抗生素</div>
      <div class="li"><b>重度</b>：口服异维 A 酸 ± 过氧化苯甲酰</div>
    </div>
    <div class="sec"><div class="lab">后遗症处理</div>
      <div class="li">红斑：强脉冲光 / 脉冲染料激光</div>
      <div class="li">色素沉着：外用维 A 酸 / 口服</div>
      <div class="li">瘢痕：点阵激光为主</div>
    </div>
  </div>`,
  cite:'皮肤科-中国痤疮治疗指南(2019修订版).pdf'
},
{
  q:'要向王主任传递玫满的优势，按患者类型给我话术',
  ans:`<div class="card">
    <h4>针对不同目标患者，传递核心优势</h4>
    <div class="sec">
      <div class="li"><b>痤疮患者</b>：米诺环素对痤疮丙酸杆菌敏感率高、耐药率更低；可建议 50mg bid</div>
      <div class="li"><b>玫瑰痤疮患者</b>：抗炎性强、组织渗透强，临床有效率高，可联合方案</div>
      <div class="li"><b>毛囊炎 / 软组织感染</b>：广谱、抗菌强、起效快，疗程约 7–14 天</div>
    </div>
    <div class="sec"><div class="lab">结合产品独特优势</div>
      <div class="li"><b>微丸制剂专利技术</b>（原惠氏专利）：缓释吸收、血药浓度更平稳</div>
    </div>
  </div>`,
  cite:'质量工艺知识库-偏差处置库.pdf'
},
{
  q:'王主任说"我们科多西环素用着挺顺手" — 怎么接？',
  ans:`<div class="card">
    <h4>不贬低同类 · 用差异化和证据回应</h4>
    <div class="sec"><div class="lab">玫满（米诺环素）的差异点</div>
      <div class="li"><b>更低耐药</b>：对痤疮丙酸杆菌敏感率高、耐药率低于多西环素</div>
      <div class="li"><b>渗透更强</b>：脂溶性高，皮肤与皮脂腺组织药物浓度更佳</div>
      <div class="li"><b>更平稳</b>：微丸缓释专利，血药浓度平稳、胃肠刺激更小</div>
    </div>
    <div class="sec"><div class="lab">合规收口（一句话）</div>
      <div class="li">“两者都是好药；遇到<b>反复、难治</b>的患者，可优先考虑玫满”——结合患者个体与说明书</div>
    </div>
  </div>`,
  cite:'质量工艺知识库-验证证据库.pdf'
}
];

const chat=document.getElementById('chat');
function render(idx, instant){
  const f=FLOWS[idx];
  chat.innerHTML =
    '<div class="row me"><div class="bubble me">'+f.q+'</div></div>'+
    '<div class="row"><img class="ava" data-fs-src="../../../assets/shared/digital_employee_avatars_50/25_east_asian_woman_navy_blazer.png" alt="小海" loading="lazy" decoding="async"><div class="ans" id="ans">'+
      '<div class="think" id="think"><span class="sp"></span>小海同学 正在深度思考…</div>'+
    '</div></div>';
  const ans=document.getElementById('ans');
  const reveal=()=>{
    ans.innerHTML =
      '<div class="think">已深度思考（用时 6s）<span class="chev">▾</span></div>'+
      '<div class="reveal">'+f.ans+'</div>'+
      '<div class="cite reveal"><span class="ic">'+I.doc+'</span>参考资料：<b>'+f.cite+'</b></div>';
    chat.scrollTop=0;
  };
  if(instant) reveal(); else setTimeout(reveal, 1100);
}
document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click',()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
    t.classList.add('on');
    render(+t.dataset.flow, false);
  });
});
document.getElementById('chip-new').addEventListener('click',()=>{
  const on=document.querySelector('.tab.on'); render(+on.dataset.flow, false);
});
render(0, true);
</script>
<script>
(() => {
  const items = Array.from(document.querySelectorAll('[data-fs-src]'));
  let index = 0;
  function hydrate(el) {
    if (!el) return;
    if (el.tagName === 'OBJECT') {
      if (!el.getAttribute('data')) el.setAttribute('data', el.getAttribute('data-fs-src'));
      return;
    }
    if (el.getAttribute('src')) return;
    el.setAttribute('src', el.getAttribute('data-fs-src'));
    if (el.tagName === 'SOURCE' && el.parentElement && el.parentElement.tagName === 'VIDEO') {
      try { el.parentElement.load(); } catch (_) {}
    }
  }
  function next() {
    if (index >= items.length) return;
    hydrate(items[index++]);
    setTimeout(next, 220);
  }
  if ('requestIdleCallback' in window) requestIdleCallback(next, { timeout: 500 });
  else setTimeout(next, 120);
})();
</script>
</body>
</html>
